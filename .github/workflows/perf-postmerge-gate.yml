name: perf post-merge detection (informational, PAUSED)
#
# PAUSED 2026-08-01: this lane no longer runs automatically. It is on-demand only
# (workflow_dispatch). The rest of this header describes the lane's design and is
# unchanged; the reason for the pause and the conditions for lifting it are in the
# block immediately above `on:`. Read that before restoring the trigger.
#
# WHAT THIS IS, AND WHAT IT IS NOT (lattice#1105).
#
# Quick-mode PR benching demotes `lattice-embed:simd` to informational, because
# repeated same-commit A/A runs produced confirmed-CI FAIL rows on identical
# binaries: machine noise above quick-mode resolution, not signal. That demotion
# is correct, but for a while three source comments claimed a "scheduled nightly
# perf lane" covered the demoted groups at full resolution. No such job existed,
# so those groups were gated in NEITHER mode. This workflow is that missing lane.
#
# It DETECTS, it does not GATE a merge. It runs AFTER a commit lands on main, so
# by construction it cannot block the merge that introduced a regression. The
# alert is the failed run. Do NOT add this to branch protection's required
# checks: a post-merge job can never be satisfied pre-merge, and adding it would
# wedge the merge queue rather than protect it.
#
# RESOLUTION CEILING, stated up front so this is not mistaken for fine-grained
# coverage: GitHub-hosted runners are shared and noisy. This lane reliably
# catches GROSS regressions (roughly the >=15% class, the magnitude that
# motivated ADR-058's workflow in the first place). It does NOT resolve
# sub-few-percent changes — the same noise floor that made quick-mode simd
# unreliable applies here. A green run means "no gross regression detected", not
# "performance is unchanged". Tightening this to sub-few-percent resolution
# requires a dedicated quiet runner and is tracked separately; do not read the
# absence of a FAIL as evidence of a small change's absence.
#
# WHY AN A/B AGAINST THE LAST MEASURED COMMIT rather than perf-baselines:
# bench-update.yml rewrites perf-baselines on nearly every perf-path push to
# main -- 121 of its 123 recorded push-triggered runs (`gh run list
# --workflow=bench-update.yml --json event,conclusion`); the other 2 failed the
# bench step and their publish job was skipped, so perf-baselines was not
# rewritten for those 2 pushes -- so a regression can usually be absorbed
# before a scheduled comparison. This lane instead advances one lightweight
# branch per architecture only after its own A/B succeeds. If GitHub drops an
# intermediate pending run, the next run widens its range back to that
# recorded commit instead of putting the skipped change in both arms. When
# that state branch has no recorded commit yet, the run falls back to the
# triggering push's event-before SHA instead.

# PAUSED 2026-08-01, NOT FIXED. The automatic push trigger is removed; the lane
# still runs on demand via workflow_dispatch, unchanged in every other respect.
#
# Why. Across its 15 verdict-producing runs this lane reported a confirmed
# regression every single time, on 15 unrelated merges. The cause is its
# decision rule, not its plumbing: the rule fails a run when a group's LOWER
# confidence bound exceeds 7%, applied one-sidedly across the 263-264 group
# comparisons a run declares, per architecture. Criterion's confidence intervals
# are tight WITHIN a run while the same groups swing widely BETWEEN runs, and a
# within-run interval cannot bound between-run variability. With that many
# groups and that spread, at least one positive excursion past 7% is close to
# certain, so the rule converts roughly half of a symmetric noise distribution
# into "confirmed regressions".
#
# Figures below are stated over a named population, because two earlier numerals
# in this header were quoted over populations that were never their own. The
# settled population is x86_64-linux alone: 15 reports declaring 263 comparisons
# twelve times and 264 three times, 3948 in total. Over that: 220 FAIL rows,
# 5.6%. Within-run intervals are tight — median CI width 0.4650 percentage
# points across the 82 FAIL rows accumulated through run 7 of the 15 (derived
# from the seven x86_64-linux job logs for those runs, `Delta point` table,
# rows with CI-lower > 7%, sorted CI-upper minus CI-lower, middle pair
# 0.46/0.47), which is the subset that median was computed on and not the
# full set.
#
# The recurrence signature: simd_throughput_384/normalize flags a CI-lower
# past 7% in 3 of the 15 x86_64-linux reports and 6 of the 14 available
# aarch64-linux reports (the aarch64 report for run 29881462420 is absent);
# the union across either architecture is 7 of 15 workflow runs. Read per
# architecture, not pooled: if those were genuine per-merge regressions that
# group would by now be about twice as slow, which it is not.
#
# Large deltas are not sign-aligned, which is what rules out an arm-ordering
# artifact: for Delta point excursions above +7% or below -7%, the split is
# 232 head-slower against 273 head-faster over the 15 x86_64-linux reports
# (3948 rows), and 44 head-slower against 30 head-faster over the 14
# completed aarch64-linux reports (3685 rows; the 15th report is absent, so
# this is a 14-report denominator, not a matching 15). Read that per
# architecture and never pooled. aarch64 leans slower while x86_64 leans
# faster, so a pooled figure is partly cancellation and overstates how
# symmetric the distribution is. The conclusion survives either way; the
# pooled version of it does not survive scrutiny. Separately, the 5.6% FAIL
# rate is 220 CI-lower > 7% rows out of the 3948 x86_64-linux comparison
# rows; that one-sided 220-row subset is the rate's numerator, not a
# population, and is not the population the signed Delta-point split is
# drawn from.
#
# Cost of leaving it on, over the same 15 x86_64-linux / 14 aarch64-linux
# reports named above. Enumeration: `gh run list --repo ohdearquant/lattice
# --workflow=perf-postmerge-gate.yml --limit 100 --json
# databaseId,headSha,event,createdAt,conclusion` returns 23 runs: 1
# workflow_dispatch, 1 cancelled push, 21 completed push runs.
#
# Of those 21, every x86_64-linux leg's gate step exits either 1 (confirmed
# regression) or 2 (refused to certify -- no comparison data, checked via
# `AB_RC:` in each job's "Classify the gate outcome" log): 15 exit 1, 6 exit
# 2. None exit 0 (clean pass) or 3 (not measurable). The 15-run population
# used throughout this header is the 15 exit-1 runs.
#
# Correction: an earlier version of this text said the run excluded from the
# 15 was the earliest, 29879966073, on the ground that its baseline fell back
# to the event parent instead of a last-measured-commit branch the other 15
# use.
# That claim does not survive checking the run's own log. Its "Resolve the
# A/B endpoints" step printed `A/B endpoints: 05291c5ddb02... ->
# d7929307de...`, and `05291c5d` is `git rev-parse d7929307de^` -- its
# ordinary immediate parent, reached via the same event-before code path
# every one of the other 14 runs in this population also used (checked the
# same log line in each; none differ). The `scripts/perf-postmerge-base.py` /
# `perf-postmerge-measured-*` state-branch mechanism referenced two
# paragraphs up postdates this entire 15-run population -- it first appears
# in a run's log on 2026-07-31, after run 30489540763, the last of the 15.
# 29879966073 belongs in the population on identical footing to the rest.
#
# The run actually excluded is 30472160128 (created 2026-07-29T16:44:53Z, a
# member of neither the 15 nor the 14): its x86_64-linux gate step ran the
# full ~87 minutes but exited 2, producing zero rows in its `Delta point`
# table, so it cannot contribute to the row counts, FAIL rate, sign split, or
# recurrence figures above -- those were in fact already computed over the
# corrected 15-run population (reproduced independently: 12x263 + 3x264 =
# 3948 total rows, 220 FAIL rows, 5.6%, sign split 232/273, recurrence 3/6/7,
# all match this header's existing figures exactly), so only this paragraph's
# prose needed correcting, not the numbers past it.
#
# Per-job on-runner duration of the "Full-mode A/B, failing on a confirmed
# regression" step (`gh run view <id> --json jobs --jq '.jobs[] |
# {name,steps}'`, startedAt/completedAt of that step): x86_64-linux median
# 87m42s, range 86m04s-88m29s (n=15); aarch64-linux median 82m32s, range
# 82m20s-83m04s (n=14). The aarch64 range previously read 77m30s-83m04s: the
# low end was run 29881462420's aarch64 leg, the one CANCELLED leg the "14
# completed" population is defined to exclude -- its 77m30s runtime is how
# long it ran before cancellation, not a completed-leg data point.
#
# Separately: queue-inclusive workflow latency (workflow createdAt to the
# later of the two jobs' completedAt, same 15 runs) is a different clock:
# median 88m25s, range 86m40s-177m47s. The earlier-cited 168m39s (run
# 30479549447) is not even the largest excursion in this population; run
# 30452387834 queued to 177m47s. Checked what the two largest excursions
# actually spend their time on, via each job's own startedAt: run
# 30452387834's jobs did not start until 89m39s after workflow createdAt,
# then ran their normal ~83-88m; run 30479549447's jobs waited 80m before
# starting. Both tails are time before the job starts running, not slow
# on-runner execution -- consistent with "queue-inclusive latency", though
# this header does not establish WHY those two runs queued that long
# (concurrent same-ref run, hosted-runner pool contention, or something
# else).
#
# What must be true before the push trigger returns. The rule needs a
# between-run variance estimate rather than a within-run confidence interval;
# it needs multiple-comparison handling across its 263-264 groups; and the
# chronically unstable groups need identifying and either stabilising or
# excluding. Any change to which groups are gated requires a repeated A/A on the
# target machine class plus a re-derivation of the threshold FIRST. Restoring
# the trigger without those changes would not restore a working detector: of
# the 21 historical push runs, 15 produced a confirmed-regression x86_64-linux
# verdict and the other 6 refused to certify rather than passing cleanly (see
# "Cost of leaving it on" above) -- on this record, resuming the trigger would
# reproduce a false alarm on most merges, not a working signal on any of them.
#
# The paths list below is retained verbatim, commented, so that restoring the
# trigger is a revert of this block rather than a re-derivation of coverage.
#
# on:
#   push:
#     branches: [main]
#     paths:
#       - 'crates/inference/src/forward/cpu/**'
#       - 'crates/inference/src/attention/**'
#       - 'crates/inference/benches/elementwise_cpu_bench.rs'
#       - 'crates/inference/Cargo.toml'
#       - 'crates/embed/src/simd/**'
#       - 'crates/embed/benches/simd.rs'
#       - 'crates/embed/Cargo.toml'
#       - 'Cargo.lock'
#       # Root Cargo.toml can carry [profile.bench] (it does not today) and
#       # .cargo/ can carry rustflags. Either can change codegen for both bench
#       # targets without touching a single line of crate source, so both must
#       # trigger this lane.
#       - 'Cargo.toml'
#       - '.cargo/**'
#       # Harness-only changes are validated before merge and deliberately do not
#       # trigger this lane: the head harness drives both A/B arms, so such a run
#       # cannot attribute a measured delta to the merged diff.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base ref for the A/B (default: the parent commit)'
        required: false
        default: ''
      head_ref:
        description: 'Head ref for the A/B (default: HEAD)'
        required: false
        default: ''

permissions:
  # Each successful push run fast-forwards its architecture's lightweight
  # progression branch. workflow_dispatch is ad hoc and never updates it.
  contents: write

concurrency:
  # One post-merge A/B run at a time for this ref. The group is ref-scoped, NOT
  # arch-scoped: the two matrix legs belong to the same run and use different
  # runner pools, so they are free to proceed together.
  #
  # GitHub keeps only one pending run per group, so a newer push can replace an
  # intermediate pending run. The per-architecture progression branch closes
  # that gap: the surviving run spans from the last successful measurement
  # through every skipped commit. This serial group also keeps two runs from
  # racing an update to the same architecture records.
  group: perf-postmerge-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  postmerge-ab:
    name: post-merge A/B (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bench-compare.sh creates a detached worktree at the base ref, so the
          # base commit must actually be present. A shallow clone silently has
          # no parent and the resolve step below would fail closed.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
          shared-key: perf-postmerge-${{ matrix.arch }}

      - name: Resolve the A/B endpoints
        id: refs
        env:
          IN_BASE: ${{ github.event.inputs.base_ref }}
          IN_HEAD: ${{ github.event.inputs.head_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          STATE_BRANCH: perf-postmerge-measured-${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 scripts/perf-postmerge-base.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-before "$EVENT_BEFORE" \
            --base-ref "$IN_BASE" \
            --head-ref "$IN_HEAD" \
            --state-branch "$STATE_BRANCH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Declare scope and resolution ceiling
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          BASE_SOURCE: ${{ steps.refs.outputs.base_source }}
          SPAN_COUNT: ${{ steps.refs.outputs.span_count }}
          STATE_BRANCH: ${{ steps.refs.outputs.state_branch }}
          STATE_BEFORE: ${{ steps.refs.outputs.state_before }}
        run: |
          {
            echo "### perf post-merge A/B (${{ matrix.arch }})"
            echo
            echo "\`$BASE\` -> \`$HEAD\`, full-mode order-balanced Criterion."
            echo "Base source: \`$BASE_SOURCE\`; commit span: \`$SPAN_COUNT\`."
            echo "Progression branch: \`$STATE_BRANCH\` (prior: \`$STATE_BEFORE\`)."
            echo
            echo "**Coverage.** Every group of the two benched targets"
            echo "(\`lattice-inference:elementwise_cpu_bench\`, \`lattice-embed:simd\`)"
            echo "gates: the quick-mode informational demotion does not apply in full"
            echo "mode, and this job sets no \`BENCH_GROUPS_*\` filter. The workspace's"
            echo "other bench targets are not run here."
            echo
            echo "**Order control.** Enforcement runs \`base₁ → head₁ → head₂ →"
            echo "base₂\`. The gate combines both order strata in log space and"
            echo "returns NOT_MEASURABLE if the observed order-bias envelope"
            echo "alone exceeds the unchanged 7% FAIL margin. NOT_MEASURABLE"
            echo "fails this job and does not advance the progression branch."
            echo
            echo "**Scope.** This lane DETECTS post-merge; it cannot gate the merge"
            echo "that introduced a regression, and it is not a required check."
            echo
            echo "**Resolution ceiling.** Hosted runners are shared and noisy. This"
            echo "reliably catches gross regressions (roughly the >=15% class). It"
            echo "does NOT resolve sub-few-percent changes. A green run means \"no"
            echo "gross regression detected\", NOT \"performance is unchanged\"."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Full-mode A/B, failing on a confirmed regression
        id: ab
        continue-on-error: true
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          PERF_POSTMERGE_STATUS_DIR: ${{ runner.temp }}/perf-postmerge-status
        run: |
          # Record the gate's OWN exit code before re-raising it. The summary
          # below has to tell "confirmed regression" from "refused to certify",
          # and job.status cannot: it only ever holds success/failure/cancelled,
          # so every earlier failure (checkout, toolchain, endpoint resolution)
          # would otherwise be reported to the reader as one of those two gate
          # verdicts and point them at a revert for a run that never benched.
          rc=0
          scripts/bench-compare.sh --full --fail-on-regression "$BASE" "$HEAD" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload machine-readable gate status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-postmerge-status-${{ matrix.arch }}
          path: ${{ runner.temp }}/perf-postmerge-status/
          if-no-files-found: warn

      - name: Record the successfully measured head
        id: record
        if: ${{ steps.ab.outputs.rc == '0' && github.event_name == 'push' }}
        env:
          HEAD: ${{ steps.refs.outputs.head }}
          STATE_BRANCH: ${{ steps.refs.outputs.state_branch }}
        run: |
          set -euo pipefail
          git push origin "$HEAD:refs/heads/$STATE_BRANCH"
          echo "recorded=true" >> "$GITHUB_OUTPUT"

      - name: Classify the gate outcome
        if: always()
        id: classify
        env:
          AB_RC: ${{ steps.ab.outputs.rc }}
          STATUS_DIR: ${{ runner.temp }}/perf-postmerge-status
        run: |
          if [ "$AB_RC" = "3" ]; then
            python3 - "$STATUS_DIR" <<'PY'
          import json
          import pathlib
          import sys

          statuses = [
              json.loads(path.read_text())
              for path in pathlib.Path(sys.argv[1]).glob("*.json")
          ]
          status = next(
              item for item in statuses if item.get("verdict") == "not_measurable"
          )
          ambient = status["ambient"]
          floor = ambient["floor_pct"]
          failing = [
              f"{phase}={idle:.1f}%"
              for phase, idle in ambient["samples"].items()
              if idle < floor
          ]
          detail = (
              f"{', '.join(failing)}; floor={floor:.1f}%"
              if failing
              else status["reason"]
          )
          print(
              "::warning title=Performance run not measurable::"
              f"verdict=not_measurable; {detail}"
          )
          PY
            echo "effective_rc=3" >> "$GITHUB_OUTPUT"
            exit 3
          fi
          # AB_RC=1 alone is not sufficient evidence of a confirmed regression:
          # it is bench-compare.sh's own contract-normalized status (see
          # scripts/lib/ensure-noindex-marker.sh and bench-compare-impl.sh), but
          # a caller running any of that chain under `set -e` propagates an
          # UN-normalized exit 1 (e.g. a raw mkdir/coreutils failure) verbatim
          # too. Require the gate's own machine-readable status artifact
          # (perf-bench-gate.py --status-out) to say verdict=regression,
          # exit_code=1 before trusting AB_RC=1 as a real regression verdict.
          effective_rc="$AB_RC"
          if [ "$AB_RC" = "1" ]; then
            if python3 - "$STATUS_DIR" <<'PY'
          import json
          import pathlib
          import sys

          statuses = [
              json.loads(path.read_text())
              for path in pathlib.Path(sys.argv[1]).glob("*.json")
          ]
          confirmed = any(
              item.get("verdict") == "regression" and item.get("exit_code") == 1
              for item in statuses
          )
          sys.exit(0 if confirmed else 1)
          PY
            then
              echo "::notice title=Confirmed regression::a gate status artifact records verdict=regression"
            else
              echo "::warning title=Unconfirmed exit 1::AB_RC=1 with no matching verdict=regression status artifact; treating as a generic pre-measurement failure (exit 2)"
              effective_rc=2
            fi
          fi
          echo "effective_rc=$effective_rc" >> "$GITHUB_OUTPUT"
          if [ "$effective_rc" != "0" ]; then
            exit "${effective_rc:-2}"
          fi

      - name: Record the outcome honestly
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          AB_RC: ${{ steps.ab.outputs.rc }}
          EFFECTIVE_RC: ${{ steps.classify.outputs.effective_rc }}
          EVENT_NAME: ${{ github.event_name }}
          STATE_BRANCH: ${{ steps.refs.outputs.state_branch }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: |
          {
            if [ "$EFFECTIVE_RC" = "3" ]; then
              echo "GAP, exit 3 — verdict \`not_measurable\`. Measurement conditions"
              echo "invalidated this run, so it produced no performance data point"
              echo "and did not advance \`$STATE_BRANCH\`. See the warning and"
              echo "\`perf-postmerge-status-${{ matrix.arch }}\` artifact."
            elif [ "$JOB_STATUS" = "success" ]; then
              echo "No gross regression detected (see ceiling above)."
              if [ "$EVENT_NAME" = "push" ]; then
                echo "Recorded \`$HEAD\` as the last successful measurement on"
                echo "\`$STATE_BRANCH\`."
              else
                echo "Ad-hoc workflow_dispatch run: progression state was not updated."
              fi
            elif [ "$AB_RC" = "0" ]; then
              echo "The A/B passed, but its successful-head record was not published."
              echo "This run is not progression evidence; the next run will retry from"
              echo "the prior recorded base. Inspect the state-publication step."
            elif [ "$EFFECTIVE_RC" = "1" ]; then
              echo "FAILED, exit 1 — a confirmed regression: a gate status artifact"
              echo "records \`verdict=regression\`. Check the flagged groups are"
              echo "reachable from the merged diff, then revert or justify."
            elif [ "$AB_RC" = "1" ]; then
              echo "FAILED, exit 2 — bench-compare.sh exited 1 but no gate status"
              echo "artifact records \`verdict=regression\`, so this is NOT a"
              echo "confirmed regression: treated as a generic pre-measurement"
              echo "failure. Inspect the failing step above; do NOT revert on this"
              echo "alone."
            elif [ "$AB_RC" = "2" ]; then
              echo "FAILED, exit 2 — the gate refused to certify this run: no"
              echo "comparison data, a partial A/B, or nothing gating among the"
              echo "results. Nothing was proven about performance either way."
              echo "Fix the measurement and re-run; do NOT revert on this alone."
            else
              echo "FAILED before or during the A/B, with no gate verdict recorded"
              echo "(\`rc=$AB_RC\`). The benchmark comparison did not reach a"
              echo "conclusion, so this says nothing about performance. Inspect the"
              echo "failing step above; do NOT revert on this alone."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
