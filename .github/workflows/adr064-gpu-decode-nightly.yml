name: ADR-064 GPU decode perf nightly (informational)
#
# DORMANT — this workflow is committed but INERT until a maintainer provisions a
# self-hosted runner labeled [self-hosted, m2max]. No such runner exists as of
# this commit.
#
# The trigger is `workflow_dispatch` and not `schedule`, because a scheduled run
# does NOT no-op while the label set has zero registered runners. The run is
# created, the job sits queued waiting for a runner that never appears, and
# GitHub cancels it at the 24-hour queue limit. Measured on run 33631888064:
# created 2026-09-02T12:47:13Z, job cancelled 2026-09-03T12:47:14Z, labels
# ["self-hosted", "m2max"]. Nine consecutive nights did this, each leaving a
# `cancelled` run that renders as a failure in run listings. See ADR-067
# Amendment 1.
#
# Dispatch does not reintroduce the fork-PR risk the schedule-only shape was
# guarding. It cannot be triggered by a pull request, only by a user with write
# access, and the `if: github.ref == 'refs/heads/main'` guard below skips the job
# when dispatched from any other ref. Restore the `schedule:` block below once a
# runner is registered.
#
# Once the runner exists this workflow measures decode tok/s + slope/intercept
# on Metal (see scripts/bench_decode_slopefit.sh) and applies the ADR-064
# gate table (scripts/adr064-gpu-decode-gate.py) against the latest
# `m2max-metal/adr064-gpu-decode` snapshot on the perf-baselines branch.
#
# Intentionally NOT a pull_request trigger: public-repo fork PRs must never be
# able to execute code on a self-hosted runner (arbitrary-code-on-our-hardware
# risk). Intentionally NOT in any branch-protection required-status set: this
# gate is proposed-only per docs/adr/ADR-067-gpu-decode-perf-regression-gates.md
# and must not become merge-blocking without explicit maintainer sign-off.

on:
  # Restore when a [self-hosted, m2max] runner is registered:
  #   schedule:
  #     - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-decode-nightly:
    name: gpu decode gate (m2max, informational)
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, m2max]
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Fetch perf-baselines snapshot (sparse)
        run: |
          git fetch --depth 1 origin perf-baselines
          git worktree add ../perf-baselines origin/perf-baselines

      - name: Run decode slope/intercept harness
        env:
          LATTICE_MODEL_DIR: ${{ vars.LATTICE_MODEL_DIR || '~/.lattice/models/qwen3.5-0.8b' }}
          SLOPEFIT_FULL: '1'
        run: |
          mkdir -p artifacts
          ./scripts/bench_decode_slopefit.sh --out artifacts/adr064-gpu-decode-current.json

      - name: Evaluate ADR-064 gate table
        run: |
          python3 scripts/adr064-gpu-decode-gate.py \
            --current artifacts/adr064-gpu-decode-current.json \
            --baseline ../perf-baselines/m2max-metal/adr064-gpu-decode/latest.json \
            --out artifacts/adr064-gate-report.md
        continue-on-error: true # informational only — never blocks; see header

      - name: Upload current JSON + gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adr064-gpu-decode-nightly-${{ github.run_id }}
          path: |
            artifacts/adr064-gpu-decode-current.json
            artifacts/adr064-gate-report.md
          retention-days: 90
