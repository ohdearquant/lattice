name: e2e-parity
# Replaces bench-regression (ADR-058 revision): live HF-vs-lattice parity on
# the same runner. Reference runs first (warms the machine), lattice second.
# Gates on greedy token agreement, reports speed informationally.
#
# Required-check shape: the workflow ALWAYS triggers (no `paths:` filter on the
# PR or merge-group event), but the expensive macOS `parity` job only runs when
# engine files actually change. A cheap always-running `parity-gate` job is the *required*
# status context — it passes when there is nothing to check and mirrors the
# parity result when there is. This avoids the classic trap where a required
# check is path-filtered, never reports on unrelated PRs, and wedges them on
# "Expected — waiting for status to be reported".

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is NOT in the default type set, and it is load-bearing
    # here: the macOS jobs below skip while a PR is a draft, so the flip out of
    # draft is the only event that can run them. Without this type the flip
    # fires nothing, the gate never re-reports, and the PR wedges. The other
    # three are the defaults, restated because naming `types` at all replaces
    # them.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'crates/inference/src/**'
      - 'crates/embed/src/**'
      - 'crates/tune/src/**'
      - 'crates/tune/tests/**'
      - 'crates/tune/Cargo.toml'
      - '.github/workflows/e2e-parity.yml'
      - 'scripts/ci-changed-files.sh'
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  workflow_dispatch:
  merge_group:
    branches: [main]
    types: [checks_requested]

# Cancel a PR's own superseded runs so they stop occupying the shared macOS
# runner pool while a newer push on the same PR waits behind them. Contention is
# real but BURSTY rather than a fixed cap: measured over a 39.6 h window, macOS
# jobs had a median queue of 0.0 min but a p90 of 32.5 min and a max of 87.8 min,
# against an ubuntu control at p90 5.7 min. So most jobs start at once and a tail
# waits a long time, which is exactly the shape superseded-run cancellation helps. Never cancel a push to main, a schedule, or a manual
# dispatch: none of those has a "next run" to fall back on if killed mid-flight.
# The event_name segment keeps a scheduled run and a main-push run from
# sharing one queue: GitHub cancels a PENDING run whenever another run enters
# its group, even with cancel-in-progress false, so a schedule/push/dispatch
# trio sharing github.ref could replace each other while queued.
concurrency:
  group: e2e-parity-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Decide whether the engine surface changed. Output drives both the expensive
  # parity job and the required gate below.
  changes:
    name: detect-engine-changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      tune: ${{ steps.filter.outputs.tune }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        shell: /usr/bin/env -u BASH_ENV -u ENV PATH=/usr/bin:/bin /bin/bash --noprofile --norc -e -u -o pipefail {0}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "tune=true" >> "$GITHUB_OUTPUT"
            echo "→ $GITHUB_EVENT_NAME trigger: full parity suite REQUIRED"
            exit 0
          fi
          if [[ ! "$CI_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::base revision must be a nonempty 40-character hexadecimal commit ID" >&2
            exit 2
          fi
          if [ "$CI_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "tune=true" >> "$GITHUB_OUTPUT"
            echo "→ all-zero base revision: full parity suite REQUIRED"
            exit 0
          fi
          TRUSTED_DETECTOR=$(mktemp)
          CHANGED_FILE=$(mktemp)
          trap 'rm -f "$TRUSTED_DETECTOR" "$CHANGED_FILE"' EXIT
          if /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/git --no-replace-objects show "${CI_BASE_SHA}:scripts/ci-changed-files.sh" > "$TRUSTED_DETECTOR"; then
            :
          else
            DETECTOR_STATUS=$?
            echo "::error::unable to load change detector from base revision (status $DETECTOR_STATUS)" >&2
            exit "$DETECTOR_STATUS"
          fi
          if /usr/bin/env -i PATH=/usr/bin:/bin GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" CI_BASE_SHA="$CI_BASE_SHA" CI_HEAD_SHA="$CI_HEAD_SHA" /bin/sh "$TRUSTED_DETECTOR" > "$CHANGED_FILE"; then
            :
          else
            DETECTOR_STATUS=$?
            echo "::error::change detector failed with status $DETECTOR_STATUS" >&2
            exit "$DETECTOR_STATUS"
          fi
          CHANGED=$(<"$CHANGED_FILE")
          echo "Changed files:"
          echo "$CHANGED"
          # Markdown is stripped BEFORE classification, and the reason is that
          # several alternations below are DIRECTORY PREFIXES rather than file
          # patterns: tests/fixtures/vision/, crates/embed/tests/wasm/,
          # crates/inference/tests/fixtures/{quarot_q4_composed_v1,ppl_gate_v1}/,
          # crates/embed/tests/fixtures/{embed_parity_v1,embed_drift_baseline_v1}/,
          # .github/actions/provision-qwen35-0-8b/ and crates/*/src/. A prefix
          # matches ANY file placed under it, so a README inside a fixture
          # directory classifies a documentation change as an engine change.
          # That is not hypothetical: PR #1159 touched 50 files, ZERO of them
          # under crates/*/src, and was classified engine=true by exactly one
          # path — tests/fixtures/vision/README.md. It then sat BLOCKED behind
          # the full macOS parity battery (parity, wasm, wasm-simd128, q4+vision,
          # ppl self-test, metal ratchet) that its diff could not reach.
          # Safe because documentation carries no compiled behaviour: no test
          # consumes a .md as data (zero include_str! of any .md across crates/,
          # against a control confirming include_str! is live in 9 files), and
          # the only .md under any fixture directory is that vision README,
          # referenced from comments rather than read.
          # `|| true` because grep -v exits 1 when a docs-ONLY diff leaves no
          # lines, which under `set -e` would abort the job instead of correctly
          # classifying it as no-engine-change.
          # Both the engine and tune classifiers read $CHANGED below, so this one
          # reassignment covers both; crates/tune/(src|tests)/ is a directory
          # prefix with the identical exposure.
          DOCS_ONLY=$(grep '\.md$' <<<"$CHANGED" || true)
          CHANGED=$(grep -v '\.md$' <<<"$CHANGED" || true)
          # Disclose the exclusion. Without this the log prints the FULL changed
          # list and then reports engine=false, and a reader diagnosing a skipped
          # gate would see a fixture path in the list with no indication it was
          # never classified.
          if [ -n "$DOCS_ONLY" ]; then
            echo "Excluded from classification (documentation, no compiled behaviour):"
            echo "$DOCS_ONLY"
          fi
          echo "Classified against:"
          echo "${CHANGED:-(nothing — documentation-only diff)}"
          # here-string, not `echo | grep -q`: -q exits at first match, echo gets
          # SIGPIPE, and under pipefail the pipeline reports 141 → the else branch
          # would silently skip the gate on large diffs (fail-open).
          # The wasm gate's own inputs (driver, harness, fixtures, the native
          # dump example) are included below so a PR that touches only those
          # still triggers wasm-parity. Without them, engine stays false and the
          # required parity-gate could pass green without the wasm path ever
          # running, a fail-open on the gate itself.
          if grep -E '^crates/(inference|embed)/src/|^crates/(inference|embed)/Cargo\.toml$|^Cargo\.lock$|^scripts/(ci-changed-files\.sh|e2e_parity_check\.py)$|^\.github/workflows/e2e-parity\.yml$|^\.github/actions/provision-qwen35-0-8b/|^\.github/actions/rust-setup/|^crates/inference/tests/fixtures/e2e_parity_reference_v1/|^tests/test_e2e_parity_reference\.py$|^crates/inference/tests/quarot_q4_composed_golden\.rs$|^crates/inference/tests/fixtures/quarot_q4_composed_v1/|^scripts/gen_quarot_q4_composed_golden\.py$|^scripts/wasm-parity\.sh$|^scripts/wasm-simd128-parity\.sh$|^crates/embed/tests/wasm/|^crates/embed/tests/fixtures/embed_parity_v1/|^crates/embed/examples/dump_parity_embeddings\.rs$|^scripts/ppl_gate_check\.py$|^scripts/ppl_gate_check_selftest\.sh$|^crates/inference/tests/fixtures/ppl_gate_v1/|^crates/inference/src/bin/eval_perplexity\.rs$|^crates/inference/src/bin/quantize_q4\.rs$|^docs/bench_results/wiki\.test\.raw$|^crates/inference/tests/vision_s3_vit_forward_test\.rs$|^crates/inference/tests/vision_s4_merger_test\.rs$|^crates/inference/tests/vision_s5b_e2e_gate_test\.rs$|^crates/inference/tests/vision_serve_e2e_test\.rs$|^tests/fixtures/vision/|^scripts/vision_goldens_qwen35\.py$|^crates/embed/tests/embed_drift_baseline\.rs$|^crates/embed/tests/fixtures/embed_drift_baseline_v1/' <<<"$CHANGED" >/dev/null; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "→ engine surface changed: parity REQUIRED"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
            echo "→ no engine change: parity not required"
          fi
          if grep -E '^crates/tune/(src|tests)/|^crates/tune/Cargo\.toml$|^Cargo\.lock$|^scripts/ci-changed-files\.sh$|^\.github/workflows/e2e-parity\.yml$|^\.github/actions/provision-qwen35-0-8b/' <<<"$CHANGED" >/dev/null; then
            echo "tune=true" >> "$GITHUB_OUTPUT"
            echo "→ tune training surface changed: layer-23 golden REQUIRED"
          else
            echo "tune=false" >> "$GITHUB_OUTPUT"
            echo "→ no tune training change: layer-23 golden not required"
          fi

  # The macOS jobs from here down carry `github.event.pull_request.draft != true`.
  # These are the long jobs (model fetch, HF reference run, then lattice), so a
  # draft under active iteration otherwise competes for the same macOS pool that
  # ready-to-merge PRs queue on. An earlier revision of this comment asserted the
  # pool was "~5 concurrent, account-wide"; that was inherited from an older
  # comment and never measured. Measured instead: median macOS queue 0.0 min,
  # p90 32.5 min, max 87.8 min over 39.6 h. The justification is the p90 tail,
  # not a fixed slot count.
  #
  # `!= true` rather than `== false` is deliberate: on merge_group, schedule,
  # workflow_dispatch and push there is no `pull_request` object at all, so the
  # expression resolves to null. `null != true` runs the job, which is the arm
  # that must not be skipped; `null == false` would be false and would silently
  # disable these gates everywhere except pull requests.
  #
  # This is not a loosened gate. parity-gate below requires each arm to be
  # literally "success", so a skipped job fails it — a draft therefore shows an
  # honest red gate meaning "parity unverified", never a green one. The gate can
  # only go green after the ready flip actually runs these jobs, which is what
  # the `ready_for_review` trigger above exists to guarantee.
  layer23-golden:
    name: layer-23 golden bridge
    needs: changes
    if: needs.changes.outputs.tune == 'true' && github.event.pull_request.draft != true
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: layer23-golden-pip-${{ runner.os }}-py311-v1

      - name: Cache HF model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen3.5-0.8B
          # Derived from the provisioning action so the cache cannot outlive the
          # thing it caches: bump the pinned revision or the expected digests and
          # this key changes with them. A hand-bumped key is a step someone
          # forgets, and a stale snapshot restored under a still-matching key is
          # exactly what the exact-set check would then report as tampering.
          key: hf-qwen35-0.8b-${{ hashFiles('.github/actions/provision-qwen35-0-8b/action.yml') }}

      - name: Install model downloader
        run: pip install "huggingface_hub==1.20.1"

      - name: Provision Qwen3.5-0.8B
        id: provision
        uses: ./.github/actions/provision-qwen35-0-8b

      - name: Link lattice model dir
        run: |
          mkdir -p "$RUNNER_TEMP/lattice-models"
          ln -sf "${{ steps.provision.outputs.model-dir }}" "$RUNNER_TEMP/lattice-models/qwen3.5-0.8b"

      - uses: ./.github/actions/rust-setup
        with:
          shared-key: layer23-golden

      - name: Run legacy-to-shared layer-23 bridge
        env:
          LATTICE_LAYER23_GOLDEN_GATE_ENFORCE: '1'
          LATTICE_LAYER23_GOLDEN_REPORT: ${{ runner.temp }}/layer23-golden-report.txt
          LATTICE_MODEL_DIR: ${{ runner.temp }}/lattice-models/qwen3.5-0.8b
        run: |
          cargo test --release -p lattice-tune \
            --test layer23_golden_bridge \
            --features train-backward \
            -- --nocapture

      - name: Upload layer-23 bridge report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer23-golden-${{ github.sha }}
          path: ${{ runner.temp }}/layer23-golden-report.txt
          if-no-files-found: error

  parity:
    name: e2e parity
    needs: changes
    if: needs.changes.outputs.engine == 'true' && github.event.pull_request.draft != true
    runs-on: macos-latest
    # 25 min, not 15: typical runtime is ~12.5 min but shared-runner speed
    # variance exceeds the old ~17% headroom — two consecutive timeout
    # cancellations mid-prompt-4 on 2026-07-01 (issue #532). Now that the
    # gate fails closed, a timeout is a hard red, so the budget must cover
    # the slow tail of the runner pool.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: e2e-pip-${{ runner.os }}-py311-v1

      - name: Cache HF model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen3.5-0.8B
          # Derived from the provisioning action so the cache cannot outlive the
          # thing it caches: bump the pinned revision or the expected digests and
          # this key changes with them. A hand-bumped key is a step someone
          # forgets, and a stale snapshot restored under a still-matching key is
          # exactly what the exact-set check would then report as tampering.
          key: hf-qwen35-0.8b-${{ hashFiles('.github/actions/provision-qwen35-0-8b/action.yml') }}

      # Step 1: install reference framework (HF transformers + torch CPU).
      # Pinned to the known-green reference set — the exact versions that
      # produced the current passing parity baseline (extracted from a green
      # `e2e parity` run). An unpinned `pip install` lets a new transformers
      # release silently change greedy-generation behavior and flip the parity
      # verdict on borderline prompts (issue #236). Dependency and model bumps
      # follow docs/e2e-parity-frozen-reference.md, including reviewed fixture
      # regeneration and matching workflow-pin updates.
      - name: Install Python deps
        run: pip install "torch==2.12.1" "transformers==5.12.1" "tokenizers==0.22.2" "huggingface_hub==1.20.1"

      # Step 2: download + hash-verify model, then symlink for lattice
      # (expects a flat dir with config.json + model.safetensors)
      - name: Provision Qwen3.5-0.8B
        id: provision
        uses: ./.github/actions/provision-qwen35-0-8b

      - name: Setup lattice model dir
        run: |
          mkdir -p ~/.lattice/models
          ln -sf "${{ steps.provision.outputs.model-dir }}" ~/.lattice/models/qwen3.5-0.8b

      # Step 4: build lattice
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: e2e-parity

      - name: Build lattice generate binary
        run: cargo build --release --bin qwen35_generate -p lattice-inference --features f16

      # Step 5: run parity check (HF first = warm machine, then lattice)
      # The offline flags are belt to the script's local_files_only braces: any
      # transformers path that still tries to resolve against the Hub fails
      # loudly here instead of quietly fetching a reference nobody verified.
      - name: Run e2e parity check
        run: python3 scripts/e2e_parity_check.py
        env:
          E2E_REPORT_PATH: parity-report.md
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'

      # Step 6: post results as PR comment
      - name: Post parity report
        if: github.event_name == 'pull_request' && always()
        # The API call's failed outcome and log remain visible, but reporting
        # does not vote on the verification command's job verdict.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: e2e-parity
          path: parity-report.md

  # REQUIRED Metal parity RATCHET leg (issue #239, promoted per ADR-066 F2
  # after a 2-week clean streak: 89/89 executed main-branch runs green,
  # 2026-07-04 through 2026-07-15, zero reds of any kind).
  #
  # RATCHET, not full-parity certification: scripts/e2e_parity_check.py
  # carries a deliberate, content-anchored waiver (METAL_EXPECTED_DIVERGENCE)
  # for the long-prefill prompt, where Metal deterministically diverges from
  # HF at the first token (open issue #535). What this required job certifies
  # is therefore: Metal dispatch path-proof, binary health, and greedy token
  # parity on every prompt EXCEPT the #535-waived one. Any divergence on any
  # NON-WAIVED prompt fails closed; the waiver is keyed by prompt content, so
  # the entire waived prompt — including a different or new divergence on it —
  # stays green while the entry exists. The waiver self-reports: if the waived
  # prompt starts passing, the run prints XPASS and instructs a maintainer to
  # delete the entry (advisory — nothing removes it automatically; see the
  # METAL_EXPECTED_DIVERGENCE comment in the script). Do not read this gate
  # as full Metal parity until #535 is fixed and the waiver removed.
  #
  # e2e-parity
  # only ever exercised the CPU (qwen35_generate) path above; this job exists
  # to prove the Metal attention/KV dispatch helpers actually ran, not just
  # that a Metal device was present.
  #
  # Gotcha (do not "fix" by adding an Apple7 family check): GitHub's
  # macos-latest runner exposes a PARAVIRTUAL Metal device. Apple7-gated
  # kernels silently no-op there, so a naive "did it run" check can go green
  # without exercising anything. The audited attention/KV pipelines this job
  # targets are NOT Apple7-gated (only the optional tiled-GEMM path is), so
  # `runs-on: macos-latest` is expected to genuinely execute them — but the
  # gate does not trust that assumption. scripts/e2e_parity_check.py
  # --backend metal requires the runtime LATTICE_METAL_PATH_PROOF marker
  # (dispatch-site counters emitted by chat_metal) and FAILS CLOSED — never
  # skip-as-green — if the marker is missing or any required counter is zero.
  # If a future CI run proves the hosted runner cannot execute the required
  # kernels despite this, switch only `runs-on` to
  # `[self-hosted, macOS, ARM64, metal]` and document why.
  #
  # Wired into parity-gate.needs below: on engine-change PR runs the gate
  # fails unless this job succeeded. It remains skipped on merge-group events
  # so the macOS leg cannot delay the required queue jobs — the PR run is its
  # enforcement point, and the gate explicitly accepts skipped-on-merge-group
  # (and only that) as non-failing.
  metal-parity:
    name: metal parity ratchet (#535 waived)
    needs: changes
    if: (needs.changes.outputs.engine == 'true' && github.event_name != 'merge_group' && github.event.pull_request.draft != true) || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: e2e-pip-${{ runner.os }}-py311-v1

      - name: Cache HF model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen3.5-0.8B
          # Derived from the provisioning action so the cache cannot outlive the
          # thing it caches: bump the pinned revision or the expected digests and
          # this key changes with them. A hand-bumped key is a step someone
          # forgets, and a stale snapshot restored under a still-matching key is
          # exactly what the exact-set check would then report as tampering.
          key: hf-qwen35-0.8b-${{ hashFiles('.github/actions/provision-qwen35-0-8b/action.yml') }}

      - name: Install Python deps
        run: pip install "torch==2.12.1" "transformers==5.12.1" "tokenizers==0.22.2" "huggingface_hub==1.20.1"

      - name: Provision Qwen3.5-0.8B
        id: provision
        uses: ./.github/actions/provision-qwen35-0-8b

      - name: Setup lattice model dir
        run: |
          mkdir -p ~/.lattice/models
          ln -sf "${{ steps.provision.outputs.model-dir }}" ~/.lattice/models/qwen3.5-0.8b

      - uses: ./.github/actions/rust-setup
        with:
          shared-key: e2e-metal-parity

      - name: Build lattice Metal binary
        run: cargo build --release --bin chat_metal -p lattice-inference --features "f16,metal-gpu"

      - name: Run Metal attention/KV parity check
        run: python3 scripts/e2e_parity_check.py --backend metal
        env:
          LATTICE_BIN: target/release/chat_metal
          LATTICE_METAL_PATH_PROOF: '1'
          E2E_MAX_TOKENS: '4'
          E2E_REPORT_PATH: metal-parity-report.md
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'

      - name: Ensure Metal report exists
        if: always()
        run: |
          test -s metal-parity-report.md || {
            printf '## Metal Attention/KV Parity Report\n\nNo report was produced. Check job logs.\n' > metal-parity-report.md
          }

      - name: Post Metal parity report
        if: github.event_name == 'pull_request' && always()
        # The API call's failed outcome and log remain visible, but reporting
        # does not vote on the verification command's job verdict.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: e2e-metal-parity
          path: metal-parity-report.md

  # Embedding-drift gate: re-embeds every frozen model corpus and checks each
  # vector against the committed release baseline.
  #
  # Runs on ubuntu-24.04-arm (aarch64) to exercise the NEON normalise path that
  # the native BERT pooling in crates/inference/src/pool.rs (via
  # crates/inference/src/model/bert.rs) dispatches on aarch64, the same ISA
  # path that production lattice deployments use. Relocated from
  # macos-latest (also aarch64) to cut the shared macOS-runner queue tax;
  # NEON coverage is identical on aarch64 Linux.
  #
  # Model checkpoints are immutable. A checkpoint revision change must also
  # change its cache key so the gate cannot reuse weights from the old revision.
  embed-drift:
    name: embed drift gate
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          shared-key: embed-drift

      - name: Cache BGE-small weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/bge-small-en-v1.5
          key: bge-small-en-v1.5-v1

      - name: Cache multilingual-e5-small weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/multilingual-e5-small
          key: multilingual-e5-small-v1

      - name: Cache all-minilm-l6-v2 weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/all-minilm-l6-v2
          key: all-minilm-l6-v2-v1

      - name: Cache paraphrase-multilingual-minilm-l12-v2 weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/paraphrase-multilingual-minilm-l12-v2
          key: paraphrase-multilingual-minilm-l12-v2-v1

      - name: Provision embedding model weights
        run: |
          set -euo pipefail
          for model in \
            bge-small-en-v1.5 \
            multilingual-e5-small \
            all-minilm-l6-v2 \
            paraphrase-multilingual-minilm-l12-v2; do
            cargo run --release -p lattice-embed --bin embed \
              -- --model "$model" --download-only
          done

      - name: Run embedding-drift gate
        run: cargo run --release -p lattice-embed --bin embed-drift -- --enforce --json

  # x86_64 counterpart to embed-drift. This starts as an observation job rather
  # than a required parity-gate dependency: the frozen threshold has live
  # evidence on aarch64, but no measured x86_64 distribution yet. Keeping this
  # job outside parity-gate and allowing it to fail makes that policy explicit:
  # missing prerequisites and numerical regressions remain visible without
  # turning an observation into a required gate.
  embed-drift-x86:
    name: embed drift gate (x86_64 observation)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert x86_64 runner
        run: test "$(uname -m)" = 'x86_64'

      - uses: ./.github/actions/rust-setup
        with:
          shared-key: embed-drift-x86

      - name: Cache BGE-small weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/bge-small-en-v1.5
          key: bge-small-en-v1.5-v1

      - name: Cache multilingual-e5-small weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/multilingual-e5-small
          key: multilingual-e5-small-v1

      - name: Cache all-minilm-l6-v2 weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/all-minilm-l6-v2
          key: all-minilm-l6-v2-v1

      - name: Cache paraphrase-multilingual-minilm-l12-v2 weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/paraphrase-multilingual-minilm-l12-v2
          key: paraphrase-multilingual-minilm-l12-v2-v1

      - name: Provision embedding model weights
        run: |
          set -euo pipefail
          for model in \
            bge-small-en-v1.5 \
            multilingual-e5-small \
            all-minilm-l6-v2 \
            paraphrase-multilingual-minilm-l12-v2; do
            cargo run --release -p lattice-embed --bin embed \
              -- --model "$model" --download-only
          done

      - name: Run x86_64 embedding-drift observation (fail-closed)
        run: cargo run --release -p lattice-embed --bin embed-drift -- --enforce --json

  # wasm embedding parity gate (PR #681). Proves the wasm32-compiled
  # `LatticeEmbedder` binding (crates/embed/src/wasm.rs) produces output that
  # matches both the committed HF-reference goldens and the native lattice
  # forward pass, for both a CLS-pooling model (bge-small-en-v1.5) and a
  # mean-pooling model (all-MiniLM-L6-v2), including a long-input MiniLM case
  # that exercises tokenizer-truncation behavior beyond the model's advisory
  # token cap. E5 and the multilingual paraphrase model are release-cadence
  # only, not gated per-PR. See scripts/wasm-parity.sh for the local driver
  # and crates/embed/tests/wasm/embed_parity_wasm.mjs for the harness.
  wasm-parity:
    name: wasm embedding parity gate
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown
          shared-key: wasm-parity

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.105-${{ runner.os }}

      # Pinned exactly to match the `wasm-bindgen` crate dependency version in
      # crates/embed/Cargo.toml (the CLI and crate embed a schema version that
      # must match exactly). Skips the (slow) reinstall if the cached binary
      # is already the right version.
      - name: Install wasm-bindgen-cli
        run: |
          if command -v wasm-bindgen >/dev/null 2>&1 && [ "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.105" ]; then
            echo "wasm-bindgen 0.2.105 already present (cache hit)"
          else
            cargo install wasm-bindgen-cli --version 0.2.105
          fi

      - name: Cache bge-small-en-v1.5 weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/bge-small-en-v1.5
          key: bge-small-en-v1.5-wasm-v1

      - name: Cache all-minilm-l6-v2 weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lattice/models/all-minilm-l6-v2
          key: all-minilm-l6-v2-wasm-v1

      # --download-only fetches model.safetensors + vocab.txt; it does not
      # fetch config.json or tokenizer.json (native from_directory doesn't
      # need them from this exact spot; see download.rs). wasm-parity.sh
      # fetches those two directly from the HF repo into the same directory.
      - name: Provision bge-small-en-v1.5 weights
        run: |
          cargo run --release -p lattice-embed --bin embed \
            -- --model bge-small-en-v1.5 --download-only

      - name: Provision all-minilm-l6-v2 weights
        run: |
          cargo run --release -p lattice-embed --bin embed \
            -- --model all-minilm-l6-v2 --download-only

      - name: Run wasm parity gate
        # LATTICE_WASM_PARITY_ENFORCE=1 makes the driver fail closed if any
        # prerequisite (tool or model file) is still missing at this point:
        # a provisioning failure must not masquerade as a skipped, green job.
        env:
          LATTICE_WASM_PARITY_ENFORCE: '1'
        run: ./scripts/wasm-parity.sh

  # wasm32 SIMD128 kernel dispatch-parity gate. Proves the wasm32 SIMD128
  # dot/L2/cosine/normalize kernels (crates/embed/src/simd/*.rs) agree with
  # the scalar reference by building `lattice-embed` for wasm32 twice (plain
  # vs `-C target-feature=+simd128`) and comparing both against a JS scalar
  # oracle, plus a dispatch-state assertion proving each build actually
  # dispatched to the kernel tier it claims to. No model weights needed here
  # (pure vector-op kernels, not the BERT forward pass), so provisioning is
  # the same rust/wasm-bindgen setup as wasm-parity above minus the model
  # caching steps. See scripts/wasm-simd128-parity.sh for the local driver
  # and crates/embed/tests/wasm/simd128_parity_wasm.mjs for the harness.
  wasm-simd128-parity:
    name: wasm SIMD128 kernel parity gate
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown
          shared-key: wasm-simd128-parity

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.105-${{ runner.os }}

      # Pinned exactly to match the `wasm-bindgen` crate dependency version in
      # crates/embed/Cargo.toml (the CLI and crate embed a schema version that
      # must match exactly). Skips the (slow) reinstall if the cached binary
      # is already the right version.
      - name: Install wasm-bindgen-cli
        run: |
          if command -v wasm-bindgen >/dev/null 2>&1 && [ "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.105" ]; then
            echo "wasm-bindgen 0.2.105 already present (cache hit)"
          else
            cargo install wasm-bindgen-cli --version 0.2.105
          fi

      - name: Run wasm SIMD128 parity gate
        # LATTICE_WASM_SIMD128_ENFORCE=1 makes the driver fail closed if any
        # prerequisite (node, wasm-bindgen, cargo, or the wasm32 target) is
        # still missing at this point: a provisioning failure must not
        # masquerade as a skipped, green job.
        env:
          LATTICE_WASM_SIMD128_ENFORCE: '1'
        run: ./scripts/wasm-simd128-parity.sh

  # Composed rotated(QuaRot)+Q4 forward-path gate (issue #320). The converter's
  # own f64 forward-equivalence check (quant/quarot/forward_equivalence.rs) gates
  # the rotation-fusion math PRE-quantization; nothing previously exercised the
  # runtime consumer of a QuaRot+Q4 artifact — MetalQwen35State::from_q4_dir
  # followed by greedy decode. This workflow regenerates an EPHEMERAL QuaRot+Q4
  # artifact from the real Qwen3.5-0.8B weights, hands it to macOS, then asserts
  # exact first-8 greedy token IDs per prompt against the committed frozen
  # lattice-self golden (crates/inference/tests/fixtures/quarot_q4_composed_v1/).
  #
  # Tolerance is exact token-ID agreement, NOT a logit tolerance: the golden is
  # generated FROM the Q4 artifact, so quantization error is already baked in and
  # a 1e-5-style float tolerance would be meaningless. LATTICE_Q4_COMPOSED_GATE_ENFORCE=1
  # makes the test fail-closed (panic, not skip) if the model/Q4 dir is missing
  # or the build lacks macOS+metal-gpu — so a provisioning failure cannot
  # masquerade as a green gate. This is the same fail-closed shape as embed-drift.
  #
  # The converter invocation below intentionally does NOT pass --tolerance,
  # so it runs at the ADR-044 §"Step 3c contract" default of 1e-5 — the same
  # value used by every non-CI invocation and by the canonical regen script
  # (scripts/gen_quarot_q4_composed_golden.py, which never passes --tolerance
  # either). assert_forward_equivalence_qwen35
  # (crates/inference/src/quant/quarot/forward_equivalence.rs) gates the
  # chain probe AND the per-tensor matrix-equivalence check against ONE
  # shared threshold — there is no CLI flag to loosen one without loosening
  # the other. An earlier revision of this job passed `--tolerance 16` to
  # absorb a one-off hosted-runner excursion recorded in #1000 (chain probe
  # max_abs_error=15.796389 on one attempt; identical rerun measured
  # 7.461e-14; 86/86 runs on main over 7/04-7/15 were clean). That was wrong:
  # 16 also loosens the per-tensor check, which exists specifically to catch
  # per-tensor corruption the chain probe cannot see (k_proj, v_proj, the
  # gate-z half of q_proj, in_proj_qkv/a/b — see the forward_equivalence
  # module doc). At tolerance=16 a corruption like `k_proj[0] += 0.5` PASSES
  # instead of refusing — forward_equivalence.rs's own
  # `per_tensor_check_catches_single_element_perturbation_orthogonal_to_probe_vector`
  # test proves that exact perturbation is refused at the correct 1e-5
  # default. Loosening a correctness gate to make CI green is not
  # acceptable even for a documented flake; #1000 remains open to root-cause
  # the chain-probe excursion as a CI-environment issue (rerun-clean,
  # non-reproducible on identical code), not to be papered over via a
  # loosened shared tolerance. Splitting the chain probe from the per-tensor
  # check onto independently configurable tolerances would require a
  # Rust-level change (a second CLI flag threaded through
  # ConversionOptions/ForwardEquivalenceConfig) — out of scope for this
  # CI-config-only change; if the chain-probe flake recurs, that Rust change
  # is the right follow-up, not a shared-tolerance bump here.
  #
  # The committed JSON golden is NEVER regenerated by CI (the regen script refuses
  # to overwrite without --update-golden). Updating it is a reviewable source
  # change that must carry rationale + mutation evidence.
  #
  # ADR-069 S3a/S4 are portable CPU-reference gates. They used to run inside the
  # macOS q4 job below even though their command enables only `f16`. Keep the
  # exact fail-closed invocation and proof markers, but run it concurrently on
  # hosted ARM Linux, whose runner pool has materially lower queue latency.
  # S5b deliberately stays on macOS below: its f16 matmul backend is
  # platform-specific, so Linux ARM would add coverage rather than preserve it.
  vision-cpu-gates:
    name: vision S3a + S4 CPU gates (ARM Linux)
    needs: changes
    if: needs.changes.outputs.engine == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: vision-cpu-pip-${{ runner.os }}-${{ runner.arch }}-py311-v1

      - name: Cache HF model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen3.5-0.8B
          key: hf-qwen35-0.8b-${{ hashFiles('.github/actions/provision-qwen35-0-8b/action.yml') }}

      - name: Install Python deps
        run: pip install "huggingface_hub==1.20.1"

      - name: Provision Qwen3.5-0.8B
        id: provision
        uses: ./.github/actions/provision-qwen35-0-8b

      - name: Setup lattice model dir
        run: |
          mkdir -p ~/.lattice/models
          ln -sf "${{ steps.provision.outputs.model-dir }}" ~/.lattice/models/qwen3.5-0.8b

      - uses: ./.github/actions/rust-setup
        with:
          shared-key: vision-cpu-gates

      - name: Run S3a + S4 CPU gates (fail-closed)
        env:
          LATTICE_VISION_S3_MODEL_DIR: ~/.lattice/models/qwen3.5-0.8b
          LATTICE_VISION_S3_GATE_ENFORCE: '1'
        run: |
          ARCH=$(uname -m)
          echo "LATTICE_VISION_CPU_RUNNER arch=$ARCH"
          test "$ARCH" = "aarch64"
          # Capture to a file, then always print it while preserving cargo's
          # status. A pipeline would let the reporter mask a gating failure.
          if cargo test --release -p lattice-inference --features f16 \
            --test vision_s3_vit_forward_test \
            --test vision_s4_merger_test -- --nocapture > vision-s3-gate.log 2>&1
          then
            cat vision-s3-gate.log
          else
            status=$?
            cat vision-s3-gate.log
            exit "$status"
          fi
          grep -q 'LATTICE_VISION_S3_COSINE' vision-s3-gate.log
          grep -q 'LATTICE_VISION_S3_MUTATION_COSINE' vision-s3-gate.log
          grep -q 'LATTICE_VISION_S4_COSINE' vision-s3-gate.log
          grep -q 'LATTICE_VISION_S4_MUTATION_COSINE' vision-s3-gate.log
          grep -q 'LATTICE_VISION_S4_E2E_COSINE' vision-s3-gate.log
          grep -q 'LATTICE_VISION_S4_E2E_MUTATION_COSINE' vision-s3-gate.log

  # The ERNIE-4.5 decoder differential test is a required CPU gate. Its
  # checkpoint is provisioned by a pinned, exact-set composite action so the
  # test cannot silently skip on a clean runner.
  paddleocr-decoder-gate:
    name: PaddleOCR-VL ERNIE-4.5 decoder gate (ARM Linux)
    needs: changes
    if: needs.changes.outputs.engine == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: paddleocr-decoder-pip-${{ runner.os }}-${{ runner.arch }}-py311-v1

      - name: Cache PaddleOCR-VL weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--PaddlePaddle--PaddleOCR-VL-1.6
          key: hf-paddleocr-vl-${{ hashFiles('.github/actions/provision-paddleocr-vl/action.yml') }}

      - name: Install Python deps
        run: pip install "huggingface_hub==1.20.1"

      - name: Provision PaddleOCR-VL checkpoint
        id: provision
        uses: ./.github/actions/provision-paddleocr-vl

      - uses: ./.github/actions/rust-setup
        with:
          shared-key: paddleocr-decoder-gate

      - name: Run PaddleOCR-VL differential gates (fail-closed)
        env:
          LATTICE_POCR_MODEL_DIR: ${{ steps.provision.outputs.model-dir }}
          LATTICE_POCR_GATE_ENFORCE: '1'
        run: |
          if cargo test --release -p lattice-inference --features f16 \
            --test paddleocr_vl_decoder_goldens_test \
            --test paddleocr_vl_vision_goldens_test \
            --test paddleocr_vl_e2e_goldens_test -- --nocapture > paddleocr-gates.log 2>&1
          then
            cat paddleocr-gates.log
          else
            status=$?
            cat paddleocr-gates.log
            exit "$status"
          fi
          grep -q '^LATTICE_POCR_DECODER_CASE ' paddleocr-gates.log
          grep -q '^LATTICE_POCR_DECODER_GATE cases=4 checkpoint_revision=c5630abae1d940eafe0697512a0325494b02ab42$' paddleocr-gates.log
          # The vision and end-to-end gates print one summary line per golden only after every
          # assertion passed; a run that skipped prints neither. The counts pin the fixture sets
          # (three synthetic grids, one image) so a silently shrunk fixture cannot pass as a run.
          test "$(grep -c '^case g[0-9]*x[0-9]*: grid [0-9]*x[0-9]* ([0-9]* patches) all checkpoints within tolerance' paddleocr-gates.log)" -eq 3
          grep -q '^paddleocr_vl_e2e: prefill .* greedy exact 24 of 24$' paddleocr-gates.log

  # The QuaRot converter and its refuse-on-fail forward-equivalence check are
  # pure f64 CPU work. Generating the 0.62 GB artifact on the macOS runner held
  # the scarce pool for 14-18 minutes before any Metal assertion ran. Generate
  # it on hosted ARM Linux, preserve it byte-for-byte in an uncompressed tar,
  # and checksum the handoff. The macOS job remains the acceptance point: it
  # loads this exact artifact through the production Metal Q4 path and compares
  # exact greedy tokens against the frozen golden.
  quarot-artifact:
    name: QuaRot Q4 artifact (ARM Linux)
    needs: changes
    if: needs.changes.outputs.engine == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: quarot-artifact-pip-${{ runner.os }}-${{ runner.arch }}-py311-v1

      - name: Cache HF model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen3.5-0.8B
          key: hf-qwen35-0.8b-${{ hashFiles('.github/actions/provision-qwen35-0-8b/action.yml') }}

      - name: Install Python deps
        run: pip install "huggingface_hub==1.20.1"

      - name: Provision Qwen3.5-0.8B
        id: provision
        uses: ./.github/actions/provision-qwen35-0-8b

      - name: Setup lattice model dir
        run: |
          mkdir -p ~/.lattice/models
          ln -sf "${{ steps.provision.outputs.model-dir }}" ~/.lattice/models/qwen3.5-0.8b

      - uses: ./.github/actions/rust-setup
        with:
          shared-key: quarot-artifact

      - name: Build QuaRot converter
        run: cargo build --release -p lattice-inference --bin quantize_quarot --features f16

      - name: Generate and verify QuaRot Q4 artifact
        run: |
          ARCH=$(uname -m)
          echo "LATTICE_QUAROT_ARTIFACT_RUNNER arch=$ARCH"
          test "$ARCH" = "aarch64"
          if target/release/quantize_quarot \
            --model-dir ~/.lattice/models/qwen3.5-0.8b \
            --output-dir "$RUNNER_TEMP/qwen3.5-0.8b-quarot-q4" \
            --seed 0xCAFE_BABE_DEAD_BEEF \
            --num-probe-tokens 4 > quarot-convert.log 2>&1
          then
            cat quarot-convert.log
          else
            status=$?
            cat quarot-convert.log
            exit "$status"
          fi
          grep -q '^Forward-equiv:' quarot-convert.log
          test -s "$RUNNER_TEMP/qwen3.5-0.8b-quarot-q4/quantize_index.json"
          test -s "$RUNNER_TEMP/qwen3.5-0.8b-quarot-q4/config.json"
          echo "LATTICE_QUAROT_ARTIFACT_READY"

      - name: Package checksummed handoff
        run: |
          tar -C "$RUNNER_TEMP/qwen3.5-0.8b-quarot-q4" \
            -cf "$RUNNER_TEMP/quarot-q4.tar" .
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 quarot-q4.tar > quarot-q4.tar.sha256
          )
          test -s "$RUNNER_TEMP/quarot-q4.tar"
          test -s "$RUNNER_TEMP/quarot-q4.tar.sha256"

      - name: Upload QuaRot handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarot-q4-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quarot-q4.tar
            ${{ runner.temp }}/quarot-q4.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  # NOTE: once this job has gone green on CI once, add "q4-composed" to the
  # repository's required status checks alongside embed-drift. That
  # governance step is intentionally not automated here.
  # FOLDED MAC JOB. q4-composed and q4-ppl-quality retain one macOS model
  # provision, one dependency install and one cache. Portable S3a/S4 and the
  # f64 QuaRot conversion run on ARM Linux above; S5b, the composed golden and
  # the Metal injection/PPL gates remain here because their exercised backends
  # are macOS-specific.
  #
  # STEP ORDER IS LOAD-BEARING: S5b builds f16 first, then the composed golden
  # adds metal-gpu. Reversing them makes cargo compile a third feature set.
  #
  # metal-parity is deliberately NOT folded in: it carries a merge_group
  # exclusion the other three do not, and folding it would push that condition
  # onto individual steps to save ~10 min.
  #
  # Gate steps carry `if: ${{ !cancelled() }}` so one failing gate still lets the
  # rest report. As three jobs, failures were naturally isolated; without this
  # the fold would hide every gate after the first red one and an agent would
  # fix them one slow round-trip at a time.
  q4-vision-gates:
    name: q4 + macOS vision gates
    needs: [changes, quarot-artifact]
    if: needs.changes.outputs.engine == 'true' && github.event.pull_request.draft != true
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download QuaRot handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quarot-q4-${{ github.run_id }}
          path: ${{ runner.temp }}/quarot-handoff

      - name: Verify and extract QuaRot handoff
        run: |
          cd "$RUNNER_TEMP/quarot-handoff"
          shasum -a 256 -c quarot-q4.tar.sha256
          mkdir -p "$RUNNER_TEMP/qwen3.5-0.8b-quarot-q4"
          tar -xf quarot-q4.tar -C "$RUNNER_TEMP/qwen3.5-0.8b-quarot-q4"
          test -s "$RUNNER_TEMP/qwen3.5-0.8b-quarot-q4/quantize_index.json"
          test -s "$RUNNER_TEMP/qwen3.5-0.8b-quarot-q4/config.json"
          echo "LATTICE_QUAROT_ARTIFACT_CONSUMED"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: q4-composed-pip-${{ runner.os }}-py311-v1

      - name: Cache HF model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen3.5-0.8B
          # Derived from the provisioning action so the cache cannot outlive the
          # thing it caches: bump the pinned revision or the expected digests and
          # this key changes with them. A hand-bumped key is a step someone
          # forgets, and a stale snapshot restored under a still-matching key is
          # exactly what the exact-set check would then report as tampering.
          key: hf-qwen35-0.8b-${{ hashFiles('.github/actions/provision-qwen35-0-8b/action.yml') }}

      # Only huggingface_hub is needed — lattice does the inference, so torch /
      # transformers (the reference framework) are not required for this gate.
      - name: Install Python deps
        run: pip install "huggingface_hub==1.20.1"

      - name: Provision Qwen3.5-0.8B
        id: provision
        uses: ./.github/actions/provision-qwen35-0-8b

      - name: Setup lattice model dir
        run: |
          mkdir -p ~/.lattice/models
          ln -sf "${{ steps.provision.outputs.model-dir }}" ~/.lattice/models/qwen3.5-0.8b

      - uses: ./.github/actions/rust-setup
        with:
          shared-key: q4-vision-gates

      # Keep S5b on macOS. `generate_multimodal_f16` reaches the Accelerate/AMX
      # f16 matmul backend here, while Linux aarch64 dispatches to its scalar
      # fallback; moving it would silently replace existing backend coverage.
      - name: Run S5b macOS f16 gate (fail-closed)
        if: ${{ !cancelled() }}
        env:
          LATTICE_VISION_S3_MODEL_DIR: ~/.lattice/models/qwen3.5-0.8b
          LATTICE_VISION_S3_GATE_ENFORCE: '1'
        run: |
          if cargo test --release -p lattice-inference --features f16 \
            --test vision_s5b_e2e_gate_test -- --nocapture > vision-s5b-gate.log 2>&1
          then
            cat vision-s5b-gate.log
          else
            status=$?
            cat vision-s5b-gate.log
            exit "$status"
          fi
          grep -q 'LATTICE_VISION_S5B_GREEDY_TOKENS' vision-s5b-gate.log

      - name: Run QuaRot Q4 composed golden gate
        if: ${{ !cancelled() }}
        env:
          LATTICE_Q4_COMPOSED_GATE_ENFORCE: '1'
          LATTICE_MODEL_DIR: ~/.lattice/models/qwen3.5-0.8b
          LATTICE_QUAROT_Q4_DIR: ${{ runner.temp }}/qwen3.5-0.8b-quarot-q4
        run: |
          cargo test --release -p lattice-inference \
            --test quarot_q4_composed_golden \
            --features "f16,metal-gpu" \
            -- --nocapture

      - name: Run HTTP vision serve Metal gate (fail-closed)
        if: ${{ !cancelled() }}
        env:
          LATTICE_VISION_S3_MODEL_DIR: ~/.lattice/models/qwen3.5-0.8b
          LATTICE_VISION_S3_GATE_ENFORCE: '1'
        run: |
          if cargo test --release -p lattice-inference --features f16,metal-gpu \
            --test vision_serve_e2e_test \
            serve_chat_completions_reaches_vision_forward_path \
            -- --exact --nocapture > vision-serve-metal-gate.log 2>&1
          then
            cat vision-serve-metal-gate.log
          else
            status=$?
            cat vision-serve-metal-gate.log
            exit "$status"
          fi
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' vision-serve-metal-gate.log

      # MP2+MP3 Metal injection gate: `forward_step_injected_logits_differ_by_row_content`,
      # `generate_multimodal_vision_injection_is_mutation_sensitive`,
      # `injected_embedding_logits_are_independent_of_token_id`,
      # `injected_embedding_never_falls_back_to_token_lookup`, and (MP3)
      # `forward_step_injected_mrope_logits_differ_by_position`
      # (crates/inference/src/forward/metal_qwen35.rs) previously ran nowhere in
      # CI: they early-returned on a missing Metal device or checkpoint instead
      # of failing, and no workflow selected them (the macOS `feature-matrix`
      # job's `--lib q4` filter does not match their names). This step reuses
      # this job's already-downloaded checkpoint (no second ~2 min
      # checkout+download job) and its macos-latest runner, which exposes a
      # PARAVIRTUAL Metal device — sufficient here because none of these five
      # tests touch the Apple7-gated tiled-GEMM path (decode-only GEMV/element-wise
      # dispatch), the same reasoning the f16-KV-cache Metal gate in ci.yml
      # documents. LATTICE_METAL_TEST_ENFORCE=1 makes a missing device or
      # checkpoint a hard failure instead of the default dev-run skip.
      #
      # The filter also selects later additions that reuse this same
      # checkpoint+device: `forward_step_mrope_emit_head_false_skips_terminal_head_dispatch`
      # (mechanism test: `emit_head=false` must skip the terminal RMSNorm +
      # lm_head dispatch entirely, not merely its readback), its MTP-weights
      # variant `forward_step_mrope_emit_head_false_skips_terminal_head_dispatch_with_mtp_weights_present_but_request_inactive`,
      # and `generate_multimodal_vision_emit_head_skip_matches_always_emit_reference`
      # (equivalence test: the skip must not change prefill state) via the
      # `emit_head` filter term, plus the checkpoint-free
      # `vision_runtime_preload_is_noop_when_unsupported` and
      # `vision_runtime_preload_failure_falls_back_to_lazy_pending_state`
      # (crates/inference/src/serve/metal_worker.rs) via the
      # `vision_runtime_preload` filter term — none of these five ran in CI
      # either, for the same reason: no workflow's filter matched their
      # names.
      #
      # `--lib inject` also matches `inject_quarot_seed_roundtrips_in_config_json`
      # (QuaRot seed round trip), `injection_replaces_lookup_and_is_mutation_sensitive`
      # (CPU f16 injection oracle), and
      # `shared_server_runner_drops_router_after_injected_shutdown` (serve-shutdown
      # regression matching only incidentally on the `injected` substring), so
      # the exact-count grep below is 13 (8 `inject`-filter matches + 3
      # `emit_head`-filter matches + 2 `vision_runtime_preload`-filter
      # matches), not 5 -- update it in the same PR if the matched test
      # surface changes. libtest ORs multiple filter arguments together, so
      # one step covers all three groups, but the filters MUST be passed to
      # libtest after `--`: `cargo test` itself accepts a single positional
      # TESTNAME (`cargo test [OPTIONS] [TESTNAME] [-- [ARGS]...]`) and exits
      # 1 with `error: unexpected argument` on the second one, before any
      # test binary is built or run.
      - name: Run MP2 Metal injection gate (fail-closed)
        if: ${{ !cancelled() }}
        env:
          LATTICE_METAL_TEST_ENFORCE: '1'
        run: |
          if cargo test --release -p lattice-inference --features f16,metal-gpu \
            --lib \
            -- inject emit_head vision_runtime_preload \
            --nocapture --test-threads=1 > vision-mp2-inject-gate.log 2>&1
          then
            cat vision-mp2-inject-gate.log
          else
            status=$?
            cat vision-mp2-inject-gate.log
            exit "$status"
          fi
          grep -Eq '^test result: ok\. 13 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' vision-mp2-inject-gate.log

  # Fail-closed control-flow self-test for the Q4 PPL gate script (issue #616).
  # Cheap, deterministic, GPU-free (sandbox tree + stub eval_perplexity), so —
  # unlike q4-ppl-quality, whose PPL golden bootstraps on the runner — this has
  # no bootstrap and is wired into parity-gate.needs as a REQUIRED guard from day
  # one. It locks the gate's fail-closed contract (RECORD-on-null, ENFORCE
  # pass/fail, hard-fail on every provisioning/parse error, env-record cannot
  # mask an armed golden, non-finite golden rejected) against future regressions.

      - name: Build eval_perplexity + quantize_q4
        run: |
          cargo build --release -p lattice-inference \
            --bin eval_perplexity --bin quantize_q4 --features "f16,metal-gpu"

      # Regenerate the ephemeral unrotated Q4 artifact (NOT committed) from the
      # real weights. Deterministic: quantize_q4 has no random seed.
      # quantize_q4 writes .q4/.f16/quantize_index.json but NOT config.json, and
      # eval_perplexity's load_cfg_for_q4 reads config.json from the Q4 dir — so
      # copy it in (the tokenizer is supplied separately via --tokenizer-dir).
      - name: Generate ephemeral Q4 artifact
        run: |
          target/release/quantize_q4 \
            --model-dir ~/.lattice/models/qwen3.5-0.8b \
            --output-dir "$RUNNER_TEMP/qwen3.5-0.8b-q4"
          cp ~/.lattice/models/qwen3.5-0.8b/config.json "$RUNNER_TEMP/qwen3.5-0.8b-q4/config.json"

      - name: Run Q4 PPL regression gate
        if: ${{ !cancelled() }}
        env:
          LATTICE_PPL_Q4_DIR: ${{ runner.temp }}/qwen3.5-0.8b-q4
          LATTICE_PPL_TOKENIZER_DIR: ~/.lattice/models/qwen3.5-0.8b
          PPL_GATE_REPORT: ppl-gate-report.md
          # Required gate: refuse to pass green if the golden is ever de-armed
          # (ppl reverted to null). RECORD-mode re-capture runs without this flag.
          LATTICE_PPL_GATE_REQUIRE_ARMED: "1"
        run: python3 scripts/ppl_gate_check.py

      - name: Ensure report exists
        if: always()
        run: |
          test -s ppl-gate-report.md || {
            printf '## Q4 perplexity regression gate (#616)\n\nNo report produced. Check job logs.\n' > ppl-gate-report.md
          }

      - name: Post PPL gate report
        if: github.event_name == 'pull_request' && always()
        # The API call's failed outcome and log remain visible, but reporting
        # does not vote on the verification command's job verdict.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: q4-ppl-gate
          path: ppl-gate-report.md

  # REQUIRED status check. Always runs, always reports. Passes when the engine
  # did not change (nothing to verify); mirrors the parity, embed-drift,
  # wasm-parity, wasm-simd128-parity, q4-composed, S3a/S4 CPU gates,
  # ppl-gate-selftest, q4-ppl-quality, and metal-parity verdicts when it did.
  # Fails closed if change-detection itself errored. metal-parity (the metal
  # parity RATCHET — #535 is deliberately waived in the script; see the job
  # comment above) is required on PR runs (promoted per ADR-066 F2, issue
  # #239); on merge-group events it is skipped by design and the gate accepts
  # exactly that skip. q4-ppl-quality is now armed
  # (golden captured on run 28841919096) and gates the shipping Q4 tier for
  # regressions.
  #
  # layer23-golden is checked independently of the engine branch below: it is
  # gated by needs.changes.outputs.tune, not .engine, so a tune-only PR (tune
  # filter true, engine filter false) must still consume its result before the
  # gate can pass. The check runs unconditionally, ahead of the engine
  # short-circuit — otherwise a tune-only change would hit the "no engine
  # change" early PASS and never evaluate the bridge job at all.
  ppl-gate-selftest:
    name: ppl-gate selftest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run ppl-gate control-flow self-test
        run: bash scripts/ppl_gate_check_selftest.sh

  # Q4 perplexity regression gate (issue #616). Measures the UNROTATED Metal Q4
  # tier (the actually-shipping quantization) over a fixed WikiText-2 slice and
  # compares against a frozen golden PPL.
  #
  # Why unrotated Q4 and not the QuaRot delta: the original ADR-044 gate asserted
  # `quarot - unrotated < 0.5`. On the current forward path offline QuaRot v0 is
  # net-NEGATIVE (+1.9 PPL worse than unrotated asymmetric Q4) by design — Hadamard
  # forces symmetric Q4 (worse fidelity floor) and offline v0 has no online R3/R4
  # rotation to recover it. A "quarot must win" gate would red main on a known,
  # accepted limitation. So #616 repoints the gate to catch a REGRESSION in the
  # shipping tier. See ADR-044 "Conclusion superseded (2026-07-06)" + issue #703.
  #
  # Why an absolute golden captured on THIS runner (paravirtual Metal): the Q4
  # forward path is numerically correct on the hosted runner (proven by q4-composed)
  # but absolute PPL differs from real Apple-GPU, so the golden must be captured
  # here. The golden was captured via a null-sentinel RECORD bootstrap (run
  # 28841919096) and is now ARMED (golden.json `ppl` = 16.589111). The gate
  # enforces fail-closed (|measured - golden| > tolerance). Corpus-slice size and
  # tolerance rationale are documented in golden.json.
  #
  # ARMED + REQUIRED: this job is wired into parity-gate.needs (the required
  # status check). To keep the required leg from being silently de-armed, the run
  # step below sets LATTICE_PPL_GATE_REQUIRE_ARMED=1 — if a future change reverts
  # `ppl` to null, the gate fails CLOSED here instead of re-entering the fail-open
  # RECORD mode. Deliberate re-capture (per golden.json `_regenerate`) runs the
  # binary/script WITHOUT that flag.
  parity-gate:
    name: parity-gate
    needs:
      [
        changes,
        parity,
        embed-drift,
        wasm-parity,
        wasm-simd128-parity,
        vision-cpu-gates,
        paddleocr-decoder-gate,
        quarot-artifact,
        q4-vision-gates,
        ppl-gate-selftest,
        metal-parity,
        layer23-golden,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve gate
        run: |
          CHANGES_RESULT="${{ needs.changes.result }}"
          ENGINE="${{ needs.changes.outputs.engine }}"
          TUNE="${{ needs.changes.outputs.tune }}"
          PARITY_RESULT="${{ needs.parity.result }}"
          DRIFT_RESULT="${{ needs.embed-drift.result }}"
          WASM_RESULT="${{ needs.wasm-parity.result }}"
          WASM_SIMD128_RESULT="${{ needs.wasm-simd128-parity.result }}"
          VISION_CPU_RESULT="${{ needs.vision-cpu-gates.result }}"
          POCR_DECODER_RESULT="${{ needs.paddleocr-decoder-gate.result }}"
          QUAROT_ARTIFACT_RESULT="${{ needs.quarot-artifact.result }}"
          # The QuaRot golden, S5b, Metal injection gate and Q4 PPL regression
          # gate remain steps of one macOS job and report one result.
          Q4VISION_RESULT="${{ needs.q4-vision-gates.result }}"
          PPL_SELFTEST_RESULT="${{ needs.ppl-gate-selftest.result }}"
          METAL_RESULT="${{ needs.metal-parity.result }}"
          LAYER23_RESULT="${{ needs.layer23-golden.result }}"
          EVENT_NAME="${{ github.event_name }}"
          # Empty on every non-pull_request event, which is what we want: the
          # draft branch below must never fire on merge_group, push, schedule,
          # or workflow_dispatch.
          DRAFT="${{ github.event.pull_request.draft }}"
          echo "changes=$CHANGES_RESULT engine=$ENGINE tune=$TUNE parity=$PARITY_RESULT embed-drift=$DRIFT_RESULT wasm-parity=$WASM_RESULT wasm-simd128-parity=$WASM_SIMD128_RESULT vision-cpu-gates=$VISION_CPU_RESULT paddleocr-decoder-gate=$POCR_DECODER_RESULT quarot-artifact=$QUAROT_ARTIFACT_RESULT q4-vision-gates=$Q4VISION_RESULT ppl-gate-selftest=$PPL_SELFTEST_RESULT metal-parity=$METAL_RESULT layer23-golden=$LAYER23_RESULT event=$EVENT_NAME"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::change-detection did not succeed — failing closed."
            exit 1
          fi
          if [ "$ENGINE" != "true" ] && [ "$ENGINE" != "false" ]; then
            echo "::error::engine selector output is missing or invalid (value=$ENGINE)."
            exit 1
          fi
          if [ "$TUNE" != "true" ] && [ "$TUNE" != "false" ]; then
            echo "::error::tune selector output is missing or invalid (value=$TUNE)."
            exit 1
          fi
          # Drafts skip the resource-intensive parity jobs to keep hosted runner
          # capacity available to PRs that are ready to merge. Those skips reach
          # the arm checks below as result=skipped, which is correctly not "success",
          # so this gate would fail anyway. It short-circuits here only so the
          # failure explains itself instead of reading as a parity regression.
          # This stays a FAILURE on purpose: a green gate has to mean parity ran.
          if [ "$DRAFT" = "true" ] && { [ "$ENGINE" = "true" ] || [ "$TUNE" = "true" ]; }; then
            echo "::error::Draft PR: resource-intensive parity jobs are deferred while this PR is a draft, so parity is UNVERIFIED and this gate fails by design. Mark the PR ready for review and these jobs run automatically on the ready_for_review event."
            exit 1
          fi
          if [ "$TUNE" = "true" ] && [ "$LAYER23_RESULT" != "success" ]; then
            echo "::error::Tune training surface changed and the layer-23 golden bridge did not succeed (result=$LAYER23_RESULT)."
            exit 1
          fi
          if [ "$ENGINE" = "false" ]; then
            echo "No engine change — parity not required. PASS."
            exit 0
          fi
          if [ "$PARITY_RESULT" != "success" ]; then
            echo "::error::Engine changed and parity did not succeed (result=$PARITY_RESULT)."
            exit 1
          fi
          if [ "$DRIFT_RESULT" != "success" ]; then
            echo "::error::Engine changed and embed-drift gate did not succeed (result=$DRIFT_RESULT)."
            exit 1
          fi
          if [ "$WASM_RESULT" != "success" ]; then
            echo "::error::Engine changed and wasm-parity gate did not succeed (result=$WASM_RESULT)."
            exit 1
          fi
          if [ "$WASM_SIMD128_RESULT" != "success" ]; then
            echo "::error::Engine changed and wasm-simd128-parity gate did not succeed (result=$WASM_SIMD128_RESULT)."
            exit 1
          fi
          if [ "$VISION_CPU_RESULT" != "success" ]; then
            echo "::error::Engine changed and the ARM Linux S3a/S4 CPU gates did not succeed (result=$VISION_CPU_RESULT)."
            exit 1
          fi
          if [ "$POCR_DECODER_RESULT" != "success" ]; then
            echo "::error::Engine changed and the ARM Linux ERNIE-4.5 decoder gate did not succeed (result=$POCR_DECODER_RESULT)."
            exit 1
          fi
          if [ "$QUAROT_ARTIFACT_RESULT" != "success" ]; then
            echo "::error::Engine changed and the ARM Linux QuaRot artifact job did not succeed (result=$QUAROT_ARTIFACT_RESULT)."
            exit 1
          fi
          if [ "$Q4VISION_RESULT" != "success" ]; then
            echo "::error::Engine changed and the q4 + macOS vision gates job did not succeed (result=$Q4VISION_RESULT). This one result covers the QuaRot composed golden, S5b, HTTP vision serve Metal, Metal injection and Q4 PPL regression gates; open the job log to see which step failed."
            exit 1
          fi
          if [ "$PPL_SELFTEST_RESULT" != "success" ]; then
            echo "::error::Engine changed and ppl-gate self-test did not succeed (result=$PPL_SELFTEST_RESULT)."
            exit 1
          fi
          if [ "$METAL_RESULT" != "success" ]; then
            if [ "$EVENT_NAME" = "merge_group" ] && [ "$METAL_RESULT" = "skipped" ]; then
              echo "metal-parity skipped on merge_group by design — its enforcement point is the PR run."
            else
              echo "::error::Engine changed and the metal parity ratchet did not succeed (result=$METAL_RESULT)."
              exit 1
            fi
          fi
          echo "Engine changed; parity, embed-drift, wasm-parity, wasm-simd128-parity, vision-cpu-gates, paddleocr-decoder-gate, quarot-artifact, q4-vision-gates, ppl-gate-selftest, and metal-parity all PASSED."
          exit 0
