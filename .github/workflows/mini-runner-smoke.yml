name: mini-runner-smoke

# One manual job that exercises the self-hosted Apple silicon runner end to
# end before any `ci` leg is routed to it: registration, checkout, the shared
# rust-setup action, a build, and one Metal test on the real GPU with Metal
# enforcement on. It runs on the self-hosted runner only while the repository
# variable MINI_RUNNER is `on`; otherwise it runs on hosted `macos-latest`.
# `ci.yml` has no workflow_dispatch trigger, so this is the dispatchable copy.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-runner-smoke
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metal-smoke:
    name: Metal smoke
    runs-on: ${{ vars.MINI_RUNNER == 'on' && fromJSON('["self-hosted","macOS","ARM64","mini-metal"]') || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      # The filter names one test, so a run that compiles the test out or
      # filters it away would still exit 0. The count check makes that red.
      - name: One Metal test, enforced
        env:
          LATTICE_METAL_TEST_ENFORCE: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p lattice-model-qwen3-embedding --lib --features metal-gpu \
            -- rms_norm_matches_pre_854_oracle_on_finite_input 2>&1 | tee smoke.log
          grep -q '^test result: ok\. 1 passed' smoke.log
