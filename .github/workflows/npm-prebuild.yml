name: npm-prebuild

on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'crates/embed/**'
      - 'crates/inference/**'
      - 'npm/lattice-embed-native/**'
      - 'npm/lattice-embed-wasm/**'
      - 'scripts/publish-npm.sh'
      - 'scripts/publish-npm-preflight-selftest.sh'
      - 'Makefile'
      - '.github/workflows/npm-prebuild.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'crates/embed/**'
      - 'crates/inference/**'
      - 'npm/lattice-embed-native/**'
      - 'npm/lattice-embed-wasm/**'
      - 'scripts/publish-npm.sh'
      - 'scripts/publish-npm-preflight-selftest.sh'
      - 'Makefile'
      - '.github/workflows/npm-prebuild.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish all npm embedding packages after the full preflight'
        required: true
        default: false
        type: boolean

concurrency:
  group: npm-prebuild-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  publish-npm-preflight-selftest:
    name: publish-npm preflight self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Self-test the npm publish preflight
        run: bash scripts/publish-npm-preflight-selftest.sh

  # The full target list lives in npm/lattice-embed-native/scripts/prebuild-matrix.json.
  # A pull request builds the targets marked for it there (the Linux targets);
  # push and workflow_dispatch build every target, so a release is always
  # assembled from the full matrix.
  plan:
    name: plan prebuild targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      include: ${{ steps.plan.outputs.include }}
      suffixes: ${{ steps.plan.outputs.suffixes }}
      napi_config: ${{ steps.plan.outputs.napi_config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate the configured matrix
        run: node npm/lattice-embed-native/scripts/assert-prebuild-matrix.mjs

      - name: Plan targets for this event
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: node npm/lattice-embed-native/scripts/plan-prebuild-matrix.mjs >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: npm-prebuild-${{ matrix.target }}
          workspaces: npm/lattice-embed-native -> target

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: contains(matrix.target, 'musl')
        with:
          version: 0.15.2

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        if: contains(matrix.target, 'musl')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - name: Install napi build dependencies
        working-directory: npm/lattice-embed-native
        run: npm ci --ignore-scripts

      - name: Build native binding (aarch64 GNU)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        working-directory: npm/lattice-embed-native
        shell: bash
        env:
          TARGET_CC: clang
          TARGET_CXX: clang++
        run: npm run build -- --target ${{ matrix.target }} ${{ matrix.args }}

      - name: Build native binding
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        working-directory: npm/lattice-embed-native
        shell: bash
        run: npm run build -- --target ${{ matrix.target }} ${{ matrix.args }}

      - name: Upload native binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: npm/lattice-embed-native/*.node
          if-no-files-found: error
          retention-days: 7

  package:
    name: package prebuilds
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install napi packaging dependencies
        working-directory: npm/lattice-embed-native
        run: npm ci --ignore-scripts

      - name: Validate the configured matrix
        working-directory: npm/lattice-embed-native
        run: npm run test:prebuild

      - name: Create platform packages
        working-directory: npm/lattice-embed-native
        run: npm run create-npm-dirs

      - name: Download native bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: npm/lattice-embed-native
          merge-multiple: true

      - name: Assemble and verify platform packages
        working-directory: npm/lattice-embed-native
        shell: bash
        env:
          PLANNED_SUFFIXES: ${{ needs.plan.outputs.suffixes }}
          PLANNED_NAPI_CONFIG: ${{ needs.plan.outputs.napi_config }}
        run: |
          set -euo pipefail
          # The planned targets replace napi.targets for this step only, so a
          # pull request's Linux-only build is assembled without the targets
          # it did not build. Push and dispatch plan every target.
          printf '%s\n' "$PLANNED_NAPI_CONFIG" > "$RUNNER_TEMP/napi-planned.json"
          npm run artifacts -- --config-path "$RUNNER_TEMP/napi-planned.json"
          planned=0
          for suffix in $PLANNED_SUFFIXES; do
            planned=$((planned + 1))
            binary="npm/$suffix/lattice-embed-native.$suffix.node"
            if [ ! -f "$binary" ]; then
              echo "::error::missing prebuilt binary: $binary"
              exit 1
            fi
            # Registry-independent content check: a package version already
            # published to npm makes `npm publish --dry-run` fail permanently
            # (name@version tuples are immutable), which would turn this
            # collector red forever after the first real release. `npm pack
            # --dry-run` only inspects local tarball contents and never
            # queries the registry; version-availability is checked later,
            # in the actual release preflight (scripts/publish-npm.sh).
            (cd "npm/$suffix" && npm pack --dry-run --json | node ../../scripts/assert-platform-packlist.mjs)
          done
          # Exactly the planned binaries: none missing (checked above) and none
          # extra, so an empty plan or a stray artifact cannot read as complete.
          found=$(find npm -type f -name '*.node' | wc -l)
          if [ "$planned" -eq 0 ] || [ "$found" -ne "$planned" ]; then
            echo "::error::$found prebuilt binaries packaged for $planned planned targets"
            exit 1
          fi

      - name: Upload assembled platform packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-native-prebuilds
          path: npm/lattice-embed-native/npm/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: npm release preflight
    needs: package
    # Manual dispatch can target any branch, but the publishing steps
    # below must only ever run against a protected main commit — never a
    # collaborator-selected branch. `environment: npm-publish` adds a manual
    # approval gate on top of the ref check (configured in repo Settings >
    # Environments).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: npm-publish-preflight

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: wasm-bindgen-cli@0.2.105

      - name: Install napi packaging dependencies
        working-directory: npm/lattice-embed-native
        run: npm ci --ignore-scripts

      - name: Validate the configured matrix
        working-directory: npm/lattice-embed-native
        run: npm run test:prebuild

      - name: Download validated platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-native-prebuilds
          path: npm/lattice-embed-native/npm

      - name: Cache native test models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.lattice/models/all-minilm-l6-v2
            ~/.lattice/models/bge-small-en-v1.5
          key: npm-native-test-models-v1

      - name: Provision native test models
        run: |
          cargo run --release -p lattice-embed --bin embed -- \
            --model all-minilm-l6-v2 --download-only
          cargo run --release -p lattice-embed --bin embed -- \
            --model bge-small-en-v1.5 --download-only

      - name: Preflight the npm release
        if: ${{ !inputs.publish }}
        run: make publish-npm-dry

      # npm trusted publishing: `npm publish` exchanges this job's OIDC token
      # (`id-token: write` above) for a short-lived publish credential, so no
      # long-lived npm token is stored in the repository. Every package this
      # job publishes must list this repository, the `npm-prebuild.yml`
      # workflow and the `npm-publish` environment as its trusted publisher in
      # its npmjs.com settings; a package without that entry refuses the
      # publish. Trusted publishing needs npm 11.5.1 or later; the check also
      # runs on a preflight dispatch so the dry run proves it first.
      - name: Require npm with trusted publishing support
        run: |
          v=$(npm --version)
          echo "npm $v"
          printf '%s\n%s\n' 11.5.1 "$v" | sort -V -C || {
            echo "npm $v is older than 11.5.1 and cannot publish through trusted publishing" >&2
            exit 1
          }

      - name: Publish the npm release
        if: inputs.publish
        env:
          NPM_PROVENANCE: '1'
        run: make publish-npm
