name: app-binaries
# Regression gate: build every binary the macOS Studio app ships, each with its
# required-features. `cargo build --workspace` skips required-features bins, so
# this is the only CI that compiles chat_metal / eval_perplexity / lattice_serve
# / train_grad_full / generate_lora / embed with the features the app actually
# builds them with.
# See scripts/build-app-bins.sh for the rationale and the two regressions that
# motivated it.
#
# Required-check shape (ADR-066 F-1): the workflow ALWAYS triggers on PRs and
# merge groups (no `paths:` filter on either event), but the expensive macOS
# build job only runs when app-binary-relevant files change. The cheap always-running
# `app-binaries-gate` job is the status context to mark required — it passes
# when there is nothing to build and mirrors the build result when there is.
# This avoids the trap where a path-filtered required check never reports on
# docs-only PRs and wedges them on "Expected — waiting for status".

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is load-bearing, not decorative. `build-app-bins` is
    # skipped while a PR is a draft, and the DEFAULT type set is
    # [opened, synchronize, reopened] — it contains no event for the
    # draft-to-ready transition. Without this line, a PR marked ready that
    # never pushes again would keep its draft-shaped run forever and could
    # never report an app-binary build, wedging the PR on a gate that fails
    # closed for drafts.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-app-bins.sh'
      - 'scripts/ci-changed-files.sh'
      - 'apps/macos/scripts/package-app.sh'
      - 'apps/macos/scripts/upload-release-assets.sh'
      - '.github/workflows/app-binaries.yml'
      - '.github/workflows/release-binaries.yml'
      - 'tests/test_macos_app_release.py'
  workflow_dispatch:
  merge_group:
    branches: [main]
    types: [checks_requested]

# Cancel a PR's own superseded runs so they stop occupying the shared macOS
# runner pool while a newer push on the same PR waits behind them. An earlier
# revision of this comment put the pool at "~5 concurrent, account-wide". That
# figure was inherited and never measured; ci.yml and e2e-parity.yml already
# retracted it and this was the last copy still asserting it as fact. Measured
# instead over a 39.6 h window on this repo: median macOS queue 0.0 min, p90
# 32.5 min, max 87.8 min, against an ubuntu control at p90 5.7 min. Contention
# is bursty rather than a fixed slot cap, so the reason to cancel superseded
# runs is the tail, not a slot count.
# Never cancel a push to main or a manual dispatch: neither
# has a "next run" to fall back on if killed mid-flight. The event_name segment
# keeps a push run and a workflow_dispatch run on the same ref out of each
# other's queue: GitHub cancels a PENDING run whenever another run enters its
# group, even with cancel-in-progress false, so two different trigger kinds
# sharing one group could still replace each other while queued.
concurrency:
  group: app-binaries-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Decide whether the app-binary surface changed. Output drives both the
  # expensive build job and the required gate below.
  changes:
    name: detect-app-bin-changes
    runs-on: ubuntu-latest
    outputs:
      bins: ${{ steps.filter.outputs.bins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify macOS app release contract
        run: python3 tests/test_macos_app_release.py -v
      - id: filter
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "bins=true" >> "$GITHUB_OUTPUT"
            echo "→ manual dispatch: app-binary build REQUIRED"
            exit 0
          fi
          CHANGED=$(./scripts/ci-changed-files.sh)
          echo "Changed files:"
          echo "$CHANGED"
          # here-string, not `echo | grep -q`: -q exits at first match, echo gets
          # SIGPIPE, and under pipefail the pipeline reports 141 → the else branch
          # would silently skip the build on large diffs (fail-open).
          if grep -E '^crates/|^Cargo\.(toml|lock)$|^scripts/(build-app-bins|ci-changed-files)\.sh$|^apps/macos/scripts/package-app\.sh$|^\.github/workflows/app-binaries\.yml$' <<<"$CHANGED" >/dev/null; then
            echo "bins=true" >> "$GITHUB_OUTPUT"
            echo "→ app-binary surface changed: build REQUIRED"
          else
            echo "bins=false" >> "$GITHUB_OUTPUT"
            echo "→ no app-binary change: build skipped, gate passes"
          fi

  # Deferred while a PR is a draft, matching the macOS legs of `ci` and
  # `feature-matrix` and every macOS job in `e2e-parity`. A draft
  # cannot merge, so a 45-minute macOS build on every draft push buys nothing
  # the ready-flip does not buy later, while occupying a runner pool whose
  # measured p90 queue is 32.5 min against an ubuntu control at 5.7 min.
  # `app-binaries-gate` fails closed on drafts so a draft is never reported as
  # having a verified app-binary build.
  build-app-bins:
    name: build app-shipped binaries
    needs: changes
    if: needs.changes.outputs.bins == 'true' && github.event.pull_request.draft != true
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: app-binaries
      - name: Build all app-shipped binaries (required-features included)
        run: ./scripts/build-app-bins.sh

  # Required status context (ADR-066 F-1). Fails closed on change-detection
  # failure, passes when nothing relevant changed, otherwise mirrors the build.
  app-binaries-gate:
    name: app-binaries-gate
    needs: [changes, build-app-bins]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve gate
        run: |
          CHANGES_RESULT="${{ needs.changes.result }}"
          BINS="${{ needs.changes.outputs.bins }}"
          BUILD_RESULT="${{ needs.build-app-bins.result }}"
          echo "changes=$CHANGES_RESULT bins=$BINS build=$BUILD_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::change-detection did not succeed — failing closed."
            exit 1
          fi
          if [ "$BINS" != "true" ]; then
            echo "No app-binary change — build not required. PASS."
            exit 0
          fi
          # Fail closed on drafts, and only after the no-change PASS above: a
          # docs-only draft defers nothing, so it must still pass. When the
          # app-binary surface HAS changed, `build-app-bins` is skipped while
          # the PR is a draft, and a skipped build must not read as a verified
          # one — a pass in the shape of a verdict is the failure mode this
          # gate exists to prevent. On merge_group, push, and workflow_dispatch
          # there is no pull_request payload, so DRAFT is empty and this branch
          # cannot fire.
          DRAFT="${{ github.event.pull_request.draft }}"
          if [ "$DRAFT" = "true" ]; then
            echo "::error::Draft PR: the macOS app-binary build is deferred while this PR is a draft, so the app-binary surface is UNVERIFIED and this gate fails by design. Mark the PR ready for review and it runs automatically on the ready_for_review event."
            exit 1
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::App-binary surface changed and build did not succeed (result=$BUILD_RESULT)."
            exit 1
          fi
          echo "App-binary surface changed; build PASSED."
          exit 0
