[workspace]
resolver = "2"
members = [
    "crates/inference",
    "crates/inference-core",
    "crates/metal-runtime",
    "crates/tokenizer",
    "crates/grammar",
    "crates/embed",
    "crates/fann",
    "crates/tune",
    "crates/transport",
    "crates/weights",
    "crates/quant",
    "crates/arch",
    "crates/serve",
    "crates/compute",
    "crates/model-io",
    "crates/models/embeddinggemma2",
    "crates/models/bert",
    "crates/models/qwen3-embedding",
    "crates/models/gemma4",
    "crates/models/ernie45",
    "crates/models/qwen35",
]

[workspace.package]
version = "0.15.0"
edition = "2024"
# MSRV, verified end-to-end (workspace + deps) on 1.93.1 and guarded by the msrv CI
# job (aarch64 macOS, f16,metal-gpu, --all-targets) so a newer-toolchain-only API
# cannot silently ship again (#568: nightly-gated NEON f16 intrinsics compiled on
# CI's pinned 1.94.1 but broke users on 1.93). Locked deps already require >=1.88,
# so 1.85 (the edition2024 floor previously set in .clippy.toml) is not attainable.
rust-version = "1.93"
authors = ["Ocean <ocean@lionagi.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ohdearquant/lattice"

[workspace.dependencies]
lattice-fann = { version = "0.15.0", path = "crates/fann" }
lattice-quant = { version = "0.15.0", path = "crates/quant" }
lattice-model-qwen35 = { version = "0.15.0", path = "crates/models/qwen35" }
# Half-precision floats
half = { version = "2", features = ["std"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Error handling
thiserror = "2.0"

# Async
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Concurrency
parking_lot = "0.12"
rayon = "1.10"

# Crypto / Hashing
sha2 = "0.10"

# Database (optional, for caching)
rusqlite = { version = "0.35", features = ["bundled"] }

# Types
indexmap = "2"
rustc-hash = "2"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Random
rand = "0.8"
rand_distr = "0.4"

# Logging
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Safe serialization
safetensors = "0.5"
memmap2 = "0.9"
bytemuck = { version = "1.14", features = ["derive"] }

# Arc swap
arc-swap = "1.7"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# CLI + HTTP server (used by lattice binary)
clap = { version = "4", features = ["derive"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
# MIME parsing for the chat-completions Content-Type guard (mirrors axum's
# own `Json` extractor rule) -- already a transitive axum 0.8 dependency,
# pinned here (same 0.3.17 the lockfile already resolves) so the direct
# dependent controls its own version instead of relying on axum's.
mime = "0.3"

# Testing
proptest = "1.0"
tempfile = "3.10"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit"] }
# Offline WGSL parsing and semantic validation for the WGPU shader artifacts.
# This matches the Naga major used transitively by wgpu 24.
naga = { version = "24.0", features = ["wgsl-in"] }
# Partial-body polling (`BodyExt::frame`) and `tower::Service::oneshot` for
# axum `Router`-level HTTP tests (ADR-080 C2 round 2). Both are already
# transitive axum 0.8 dependencies; declared here so direct dev-dependents
# pin one workspace-wide version instead of each re-pinning locally.
http-body-util = "0.1"
tower = "0.5"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
metal = "0.33"
objc = "0.2"
approx = "0.5"

lattice-arch = { version = "0.15.0", path = "crates/arch" }
lattice-compute = { version = "0.15.0", path = "crates/compute" }
lattice-grammar = { version = "0.15.0", path = "crates/grammar" }
lattice-inference-core = { version = "0.15.0", path = "crates/inference-core" }
lattice-metal-runtime = { version = "0.15.0", path = "crates/metal-runtime" }
lattice-model-io = { version = "0.15.0", path = "crates/model-io", default-features = false }
lattice-tokenizer = { version = "0.15.0", path = "crates/tokenizer" }
lattice-weights = { version = "0.15.0", path = "crates/weights" }
lattice-model-embeddinggemma2 = { version = "0.15.0", path = "crates/models/embeddinggemma2" }
lattice-model-bert = { version = "0.15.0", path = "crates/models/bert", default-features = false }
lattice-model-qwen3-embedding = { version = "0.15.0", path = "crates/models/qwen3-embedding", default-features = false }
lattice-model-gemma4 = { version = "0.15.0", path = "crates/models/gemma4", default-features = false }
lattice-model-ernie45 = { version = "0.15.0", path = "crates/models/ernie45" }

[workspace.lints.clippy]
# Correctness
correctness = { level = "deny", priority = -1 }

# Style — tighten defaults
needless_return = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
uninlined_format_args = "warn"

# Complexity
type_complexity = "warn"
too_many_arguments = "warn"

# Performance
large_enum_variant = "warn"

# SIMD — these fire on target-gated intrinsics that are behind #[cfg(target_arch)] + #[target_feature].
# False positives: the code never runs on a platform that doesn't support the intrinsic.
incompatible_msrv = "allow"
needless_range_loop = "allow"
missing_safety_doc = "warn"

# SIMD/unsafe — allow in unsafe fns (edition 2024 strictness)
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "allow"
