[package]
name = "lattice-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust transformer inference engine — safetensors loading, SIMD matmul, BGE/Qwen3 embeddings"
keywords = ["inference", "transformer", "llm", "embeddings", "metal"]
categories = ["science", "algorithms", "hardware-support"]
# Heavy test-only fixtures push the packaged crate past the crates.io 10MB
# upload limit. They are consumed only by integration tests, which are never
# run from the published crate. The two tokenizer vocabularies below are 43MB
# raw between them and were worth about 7MB of the compressed archive: with
# them in, the package measured 10,463,553 bytes against a 10,485,760 byte
# limit, before the generated Cargo.lock and manifests; with them out, 2.8MB.
exclude = [
    "tests/fixtures/tokenizers",
    "tests/fixtures/gdn_chunk",
    "tests/fixtures/gemma4/tokenizer",
    "tests/fixtures/paddleocr_vl/tokenizer",
]

[package.metadata.docs.rs]
features = ["f16", "x86-gemm", "mixture", "train-backward", "wgpu-gpu"]

[package.metadata.gpu-bench-handoff]
version = 1
targets = [
    "cross_turn_prefix_cache_bench",
    "decode_attn_bench",
    "lm_head_bench",
    "metal_decode_bench",
    "mtp_decode",
    "topk_readback",
]
# Binaries launched as built executables under the same handoff. Each takes the
# GPU lock itself; a binary may do so once per process.
bins = [
    "bench_decode_ab",
    "bench_decode_slopefit",
    "bench_logit_dump",
    "eval_perplexity",
]

[features]
qwen35 = ["dep:lattice-model-qwen35", "lattice-router/qwen35"]
default = ["std", "download", "image", "bert", "embeddinggemma2", "qwen3", "gemma4", "ernie45", "paddleocr-vl", "qwen35"]
bert = ["dep:lattice-model-bert"]
gemma4 = ["dep:lattice-model-gemma4"]
embeddinggemma2 = ["dep:lattice-model-embeddinggemma2"]
qwen3 = ["dep:lattice-model-qwen3-embedding"]
ernie45 = ["dep:lattice-model-ernie45"]
paddleocr-vl = ["ernie45", "lattice-model-ernie45?/paddleocr-vl"]
# Unsupported, version-coupled interface for `lattice-serve` (ADR-103
# Amendment 4): the hidden `serving_support` module and the router items it
# needs. Off by default; `lattice-serve` depends on this crate with an exact
# version and enables it. Not part of the public API.
serving-support = ["lattice-model-gemma4?/serving-support", "lattice-model-qwen35?/serving-support", "lattice-router/serving-support"]
std = ["lattice-model-bert?/std"]
# Encoded PNG/JPEG input; raw image tensors remain available without decoding.
image = ["lattice-model-io/image", "lattice-model-embeddinggemma2?/image", "lattice-model-ernie45?/image", "lattice-model-qwen35?/image"]
f16 = ["lattice-weights/f16", "lattice-router/f16", "lattice-model-bert?/f16", "lattice-model-gemma4?/f16", "lattice-model-ernie45?/f16", "lattice-model-qwen35?/f16"]
# lattice-fann supplies the shared LoRA descriptor/blend-validation module
# (issue #615) that `blend_lora_layer_data` and `chat_metal` call, so it must
# be present whenever this feature is — not just under `mixture`.
metal-gpu = ["dep:metal", "dep:objc", "dep:lattice-fann", "dep:bytemuck", "dep:lattice-metal-runtime", "lattice-metal-runtime/metal-gpu", "lattice-model-embeddinggemma2?/metal-gpu", "lattice-model-qwen3-embedding?/metal-gpu", "lattice-model-ernie45?/metal-gpu", "lattice-model-qwen35?/metal-gpu", "lattice-router/metal-gpu"]
wgpu-gpu = ["dep:bytemuck", "lattice-compute/wgpu-gpu", "dep:lattice-model-qwen3-embedding", "lattice-model-qwen3-embedding/wgpu-gpu"]
bench-internals = ["lattice-compute/bench-internals", "lattice-grammar/bench-internals", "lattice-model-qwen35?/bench-internals"]
# Stock `gemm` for multi-row `matmul_bt` on Linux x86_64 (ADR-099 F1, step 1). Off by default.
x86-gemm = ["lattice-compute/x86-gemm", "lattice-model-bert?/x86-gemm", "lattice-model-qwen3-embedding?/x86-gemm", "lattice-model-gemma4?/x86-gemm", "lattice-model-ernie45?/x86-gemm"]
bench-ort = ["dep:ort", "dep:tokenizers", "f16"]
backfill = ["dep:rusqlite", "f16"]
download = ["lattice-model-io/download", "lattice-model-bert?/download", "lattice-model-qwen3-embedding?/download"]
train-backward = ["dep:lattice-backward", "lattice-model-qwen35?/train-backward"]
# AdapterRouter gate: enables the lattice-fann backed routing module.
# generate_with_lora_mixture does NOT require this feature — it is always
# available under `metal-gpu`. blend_lora_layer_data now depends on
# lattice-fann too (issue #615), but that dep is already pulled in by
# `metal-gpu` itself, so this feature only adds the routing module.
mixture = ["dep:lattice-fann", "lattice-router/mixture"]
# Enables the bounded router trainer for qualification; serving remains opt-in.
router-learning = ["mixture", "lattice-fann/online-router", "lattice-model-qwen35?/router-learning", "lattice-router/router-learning"]
# GDN state-traffic byte counters (issue #422, measure-first for ADR-058).
# Opt-in only: the default decode path stays byte-identical when this is off.
gdn-state-counters = ["lattice-model-qwen35?/gdn-state-counters"]
# os_signpost instrumentation of the Metal decode path (W1.0), for capturing
# a Metal System Trace of command-buffer/dispatch/wait structure in
# Instruments. Opt-in only: every call site is a zero-sized no-op guard when
# this is off, so the default decode path stays byte-identical.
signpost = ["lattice-model-qwen35?/signpost"]
# Exposes test-only fixture constructors (currently: a tiny all-zero-weight
# Qwen35Model, ADR-080 C2) as `pub` library API, gated so they never
# ship in a normal build. Needed because bin targets (lattice.rs,
# lattice_serve.rs) link against this crate as an ordinary dependency and
# cannot see its `#[cfg(test)]`-only internals -- only a real Cargo feature
# crosses that boundary.
test-utils = ["lattice-backward?/test-utils", "lattice-model-bert?/test-utils", "lattice-model-gemma4?/test-utils", "lattice-model-qwen35?/test-utils"]

[dependencies]
lattice-model-qwen35 = { workspace = true, optional = true }
lattice-model-bert = { workspace = true, optional = true }
lattice-model-qwen3-embedding = { workspace = true, optional = true }
lattice-model-gemma4 = { workspace = true, optional = true }
