memmap2 = "0.9"
indexmap.workspace = true
rustc-hash.workspace = true
rayon = { workspace = true }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing = { workspace = true, features = ["default"] }
sha2.workspace = true
rusqlite = { workspace = true, optional = true }
metal = { workspace = true, optional = true }
objc = { workspace = true, optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
ort = { version = "2.0.0-rc.12", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["progressbar", "onig"] }
lattice-backward = { version = "0.15.0", path = "../backward", optional = true }
lattice-compute = { version = "0.15.0", path = "../compute" }
lattice-forecast = { version = "0.15.0", path = "../forecast" }
lattice-fann = { version = "0.15.0", path = "../fann", optional = true }
lattice-grammar = { version = "0.15.0", path = "../grammar" }
lattice-inference-core = { version = "0.15.0", path = "../inference-core" }
lattice-metal-runtime = { version = "0.15.0", path = "../metal-runtime", optional = true }
lattice-arch = { version = "0.15.0", path = "../arch" }
lattice-model-io = { version = "0.15.0", path = "../model-io", default-features = false }
lattice-model-embeddinggemma2 = { workspace = true, optional = true }
lattice-model-ernie45 = { workspace = true, optional = true }
lattice-quant = { version = "0.15.0", path = "../quant" }
lattice-router = { version = "0.15.0", path = "../router" }
lattice-tokenizer = { version = "0.15.0", path = "../tokenizer" }
lattice-weights = { version = "0.15.0", path = "../weights" }


[[bin]]
name = "backfill_qwen3"
path = "src/bin/backfill_qwen3.rs"
required-features = ["backfill", "qwen3"]

[[bin]]
name = "chat_metal"
path = "src/bin/chat_metal.rs"
required-features = ["f16", "metal-gpu", "qwen35"]

# ADR-090 R03. Excluded from `cargo test`'s default target set on purpose: this
# gate enforces by default (a missing checkpoint or a missing `f16` feature is a
# panic, never a skip line), and the 1.6 GiB bf16 checkpoint it replays is not on
# a CI runner. Exclusion by a manifest declaration is greppable; a runtime skip
# branch renders as a pass, which is the failure this gate was written to avoid.
# Select it explicitly:
#   cargo test -p lattice-inference --test cpu_pre_migration_greedy_golden --features f16
# The checkpoint-free controls in its `controls` module DO run in CI; see the
# "R03 golden gate controls" step in .github/workflows/ci.yml.
[[test]]
name = "cpu_pre_migration_greedy_golden"
test = false
required-features = ["qwen35"]

# ADR-090 R03 row D, the allocation half of the pair evidence. Excluded for two
# independent reasons, either sufficient. It declares a `#[global_allocator]`,
# which applies to the whole binary it is linked into, so it must be its own
# target and must not be pulled into a shared one. And its measurement body
# enforces by default against the same 1.6 GiB bf16 checkpoint the gate above
# replays, which is not on a CI runner.
#
# It is an A/B instrument: a global allocator is per BINARY, so the comparison is
# this target run at the base ref and again at the head ref with the two printed
# records diffed. Nothing in it asserts a cross-ref delta, because nothing in it
# can see one.
#   cargo test -p lattice-inference --test decoder_allocation_arm --features f16 \
#     -- --nocapture --test-threads=1
# Its two checkpoint-free controls -- that the counter is live including the
# zeroed path, and that a vocabulary-width buffer registers in the histogram --
# live in a `controls` module that CI runs by name (`-- controls::`), because
# `--all-targets` COMPILES a `test = false` target without ever RUNNING it. The
# module boundary, rather than a `--skip` of the measurement, is what keeps a
# checkpoint-needing test added later from being dragged into that CI step.
[[test]]
name = "decoder_allocation_arm"
test = false
required-features = ["qwen35"]

# The shared benchmark allocator needs a standalone, single-threaded control process.
[[test]]
name = "inference_perf_allocation_gate"
harness = false
required-features = ["bench-internals"]

