[package]
name = "lattice-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SIMD-accelerated vector operations and embedding generation"
keywords = ["embeddings", "simd", "vector-search", "bert", "semantic-search"]
categories = ["science", "text-processing", "algorithms"]

# `rlib` keeps existing native consumers (crates depending on this as a Rust
# library) working unchanged. `cdylib` additionally produces a linkable
# dynamic library, which is what makes `wasm-bindgen`'s wasm output loadable
# by a JS host: an `rlib` alone cannot be linked into a standalone `.wasm`
# module.
[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.docs.rs]
features = ["x86-gemm"]

[dependencies]
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Caching
lru = "0.18.2"
sha2 = { workspace = true }
parking_lot = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Embedding generation, pure Rust, from the model-family crates directly rather than
# through the `lattice-inference` facade: BERT (`BertModel`), Qwen3 (`QwenModel`) and
# Qwen3.5 (the vision and F16 text-embedding path). Unconditional (applies to every
# target): the feature sets are identical on native and wasm, so there is nothing
# target-specific left to split (contrast `tokio` below, which genuinely must stay
# split). `f16` adds F8_E4M3/F8_E5M2 tensor loading (F16/BF16 load in every feature
# set), so it stays requested here for an embedding checkpoint shipped in one of those
# dtypes. `download` (ureq -> rustls -> ring) is deliberately OFF here: it does not
# compile to wasm32-unknown-unknown, ring's build script does not cross-compile to
# aarch64-unknown-linux-gnu under a zig toolchain, and the embedding compute path does
# not use it. The native `embed` binary re-enables first-use model downloads through
# this crate's own `download` feature (in `default`), which forwards the BERT and Qwen3
# crates' `download`. That forward is wasm-safe because `lattice-model-io` gates its
# ureq/download stack to non-wasm targets, so a plain `--features wasm` build stays
# download-free; edge/cross builds drop it with `--no-default-features --features
# native`. See issue #1095.
lattice-model-bert = { workspace = true, optional = true, features = ["std", "f16"] }
lattice-model-qwen3 = { workspace = true, optional = true }
lattice-model-qwen35 = { workspace = true, optional = true, features = ["f16"] }
lattice-model-embeddinggemma2 = { workspace = true, optional = true }
lattice-compute = { version = "0.15.0", path = "../compute", optional = true }
lattice-inference-core = { version = "0.15.0", path = "../inference-core", optional = true }
lattice-arch = { version = "0.15.0", path = "../arch", optional = true }
lattice-tokenizer = { version = "0.15.0", path = "../tokenizer", optional = true }
lattice-weights = { version = "0.15.0", path = "../weights", optional = true, features = ["f16"] }

# `tokio` stays split into target-specific tables below (unlike the model crates
# above, whose feature sets are the same on every target). Reason: this
# workspace's `[workspace.dependencies] tokio` entry sets `features = ["full"]`,
# and Cargo's workspace-dependency inheritance ADDS a package's `features = [...]`
# on top of that base list rather than replacing it, so
# `tokio = { workspace = true, features = ["sync", "rt"] }` still resolves to the
# full feature set (verified via `cargo metadata`: the resolved feature list is
# `["full", "sync", "rt"]`). `full` pulls in `net`, which pulls in `mio`, which
# does not support wasm32-unknown-unknown. A single unconditional `[dependencies]`
# entry can't avoid this because Cargo unions features across every matching table
# for a given target, so the only way to give wasm a trimmed `tokio` is to have no
# unconditional entry at all: one table for wasm, one for everything else.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.0", default-features = false, features = ["sync", "rt"] }
# JS bindings for the `wasm` feature. Target-gated (this table only applies to
# wasm32) AND feature-gated (`optional = true`, enabled only by the `wasm`
# feature below), so a plain non-wasm feature build of this crate, native or
# wasm32, never pulls these in. `js-sys`/`web-sys` are not needed: the
# bindings surface (constructor + `embed`) is plain data in and Vec<f32>/
# JsValue out, both of which `wasm-bindgen` converts natively without an
# extra JS-API-binding crate.
# Pinned exactly (not just "0.2") to match the `wasm-bindgen` CLI version used
# for the JS-glue generation step (`wasm-bindgen-cli`): the crate and CLI
# embed a schema version that must match exactly, or `wasm-bindgen` (the CLI)
# refuses to process the `.wasm` with a version-mismatch error.
wasm-bindgen = { version = "=0.2.105", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
lattice-inference = { version = "0.15.0", path = "../inference", default-features = false, features = ["bert", "qwen3", "std", "test-utils", "qwen35"] }
lattice-tokenizer = { version = "0.15.0", path = "../tokenizer" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.5", features = ["async_tokio"] }
simsimd = "6"
proptest = "1"
tempfile = { workspace = true }
# Test-only: encodes small procedural PNGs for the vision-embedding wrapper's
# unit tests. PNG-only is intentional here (these tests only ever encode
# PNGs); lattice-inference's own (non-dev) dependency additionally enables
# jpeg for its broader image-loading surface, which this crate's tests don't
# exercise.
image = { version = "0.25", default-features = false, features = ["png"] }
lattice-transport = { version = "0.15.0", path = "../transport" }
serde_json = { workspace = true }

[features]
default = ["native", "download", "image"]
native = [
    "dep:lattice-model-bert",
    "dep:lattice-model-qwen3",
    "dep:lattice-model-qwen35",
    "dep:lattice-model-embeddinggemma2",
    "dep:lattice-compute",
    "dep:lattice-inference-core",
    "dep:lattice-arch",
    "dep:lattice-tokenizer",
    "dep:lattice-weights",
]
image = ["native", "lattice-model-qwen35/image", "lattice-model-embeddinggemma2/image"]
# First-use model downloads for the native `embed` binary (its `--download-only`
# flag and the implicit fetch inside `BertModel::from_pretrained`). Implies
# `native` (downloads need the model crates) and forwards the BERT and Qwen3 crates'
# `download`. In `default`, so a plain native
# `cargo run -p lattice-embed --bin embed` keeps downloading models. It is safe on
# wasm even when `default` is active: `lattice-model-io` gates its ureq/download stack
# to non-wasm targets, so a plain `--features wasm` build resolves download-free.
# Edge/cross builds still drop it with `--no-default-features --features native`
# (ring does not cross-compile to aarch64 under zig). See #1095.
download = ["native", "lattice-model-bert/download", "lattice-model-qwen3/download"]
# wasm-bindgen JS bindings (`LatticeEmbedder`) for building a browser-loadable
# `.wasm` module. Only meaningful together with `native` (it wraps
# `lattice_model_bert::BertModel`); the `wasm-bindgen`/`console_error_panic_hook`
# dependencies it activates are additionally target-gated to wasm32 above, so
# enabling this feature on a non-wasm target is a no-op rather than a build error.
wasm = ["native", "dep:wasm-bindgen", "dep:console_error_panic_hook"]
metal-gpu = [
    "lattice-model-qwen3/metal-gpu",
    "lattice-model-qwen35/metal-gpu",
    "lattice-model-embeddinggemma2/metal-gpu",
]
x86-gemm = ["lattice-compute/x86-gemm", "lattice-model-bert/x86-gemm", "lattice-model-qwen3/x86-gemm"]
# Deprecated no-op: the AVX-512 VNNI int8 kernel this used to gate is now
# compiled unconditionally on x86_64 (runtime-dispatched via
# `SimdConfig::avx512vnni_enabled`, same pattern as the ungated f32 AVX-512F
# kernel in dot_product.rs) and no longer needs an opt-in Cargo feature. Kept
# as a no-op because it is part of the published surface (removing it would
# break manifests that list `--features avx512`).
avx512 = []
# Deprecated no-op: gated a bench module for a service removed long ago, but the
# feature is part of the published 0.4.x surface (removing it would break manifests
# that list it). Remove in 0.5.0.
local = []

[[bin]]
name = "embed"
path = "src/bin/embed.rs"
required-features = ["native"]

[[bin]]
name = "embed-drift"
path = "src/bin/embed-drift.rs"
required-features = ["native"]

[[example]]
name = "basic_embed"
required-features = ["native"]

[[example]]
name = "dump_parity_embeddings"
required-features = ["native"]

[[example]]
name = "similarity"

[[bench]]
name = "simd_bench"
harness = false

[[bench]]
name = "simd"
harness = false

[[bench]]
name = "embeddings"
harness = false

[[bench]]
name = "simsimd_comparison"
harness = false

[[bench]]
name = "simd_opt_bench"
harness = false

[lints]
workspace = true
