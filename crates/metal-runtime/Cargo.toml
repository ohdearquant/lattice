[package]
name = "lattice-metal-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Metal buffer and pipeline helpers for Lattice"
keywords = ["inference", "metal", "lattice"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = []
features = ["metal-gpu"]

[features]
default = []
metal-gpu = ["dep:metal", "dep:objc", "dep:bytemuck", "measurement"]
# Internal shared GPU measurement lock, without the Metal API dependencies.
measurement = ["dep:serde", "dep:serde_json", "dep:libc"]

[dependencies]
lattice-inference-core = { version = "0.15.0", path = "../inference-core" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }
bytemuck = { workspace = true, optional = true }
# The GPU test lock (`measurement`): the bench supervisor's handoff frames are JSON, and the
# supervisor is probed with `kill(pid, 0)` and the lock file refreshed with `futimes`.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
