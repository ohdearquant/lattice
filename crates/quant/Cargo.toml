[package]
name = "lattice-quant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Quantization for Lattice inference: Walsh-Hadamard and QuaRot rotations, the offline QuaRot conversion of Qwen3.5 checkpoints, and the Q4 checkpoint manifest reader"
keywords = ["quantization", "hadamard", "quarot", "rotation", "inference"]
categories = ["science", "mathematics"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
lattice-inference-core = { version = "0.15.0", path = "../inference-core" }
lattice-model-config = { version = "0.15.0", path = "../model-config" }
lattice-weights = { version = "0.15.0", path = "../weights" }
memmap2 = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# The FIFO refusal test in q4_manifest creates its fixture with mkfifo.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
