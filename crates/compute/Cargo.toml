[package]
name = "lattice-compute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side and optional WGPU compute for Lattice inference: rotary position embedding tables (including Gemma 4), KV caches, LoRA hooks, numerical diagnostics, option scoring, attention row semantics and CPU kernels"
keywords = ["inference", "rope", "transformer", "llm", "cpu"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
qwen2-audio-stem = ["dep:libm"]
# Bench-only entry point for the packed-batch standard attention path (`attention::standard::bench_support`).
bench-internals = []
x86-gemm = ["dep:gemm"]
wgpu-gpu = ["dep:wgpu", "dep:pollster", "dep:tracing"]
# Counts `matmul_into` calls for downstream crates' tests (`forward::cpu::observe_matmul_calls`). Off by default,
# so ordinary builds compile no counter.
test-utils = []

[dependencies]
half.workspace = true
libm = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
gemm = { version = "=0.18.2", optional = true }
lattice-inference-core = { version = "0.15.0", path = "../inference-core" }
lattice-arch = { version = "0.15.0", path = "../arch" }
lattice-tokenizer = { version = "0.15.0", path = "../tokenizer" }
lattice-weights = { version = "0.15.0", path = "../weights" }
indexmap.workspace = true
rayon = { workspace = true }
rustc-hash.workspace = true

[dev-dependencies]
serde_json.workspace = true
approx = "0.5"
naga.workspace = true
proptest = { workspace = true }

[lints]
workspace = true

[[example]]
name = "qwen2_audio_stem_fixture"
path = "examples/qwen2_audio_stem_fixture.rs"
required-features = ["qwen2-audio-stem"]
