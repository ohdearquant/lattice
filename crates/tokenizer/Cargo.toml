[package]
name = "lattice-tokenizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust tokenizers for Lattice inference"
keywords = ["tokenizer", "wordpiece", "sentencepiece", "bpe", "inference"]
categories = ["science", "algorithms"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
base64.workspace = true
lattice-inference-core = { version = "0.16.0", path = "../inference-core" }
rayon = { workspace = true, optional = true }
regex.workspace = true
sha2.workspace = true
tracing = { workspace = true }
unicode-normalization-alignments.workspace = true
unicode-segmentation.workspace = true
unicode_categories.workspace = true

[dev-dependencies]
rayon = { workspace = true }

[lints]
workspace = true
