schema = 1

# This inventory covers local script and Make entry points. Raw Rust Metal
# benches/examples are owned by #1115 / PR #1195, where the harness itself
# takes the GPU lock; wrapping those a second time here would deadlock on flock.
# Hosted workflow measurements are intentionally outside this local-machine
# convention. In particular, issue #1121 explicitly excludes bench-update.yml.

[[entry]]
path = "scripts/adr064-gpu-decode-gate.py"
role = "consumer"
supervision = "none"

[[entry]]
path = "scripts/bench-ci.sh"
role = "measurement"
supervision = "both-locks+quiet"

[[entry]]
path = "scripts/bench-command.sh"
role = "supervisor"
supervision = "both-locks"

[[entry]]
path = "scripts/bench-compare.sh"
role = "measurement"
supervision = "both-locks+three-phase-quiet"

